<style>
:root{
  --ground:#18191d;
  --slate:#212329;
  --slate-2:#292c33;
  --edge:#33363e;
  --ink:#ece9e3;
  --dim:#9c9fa6;
  --faint:#62666e;
  --dia:#5fd8e0;
  --up:#6cc070;
  --down:#e0645a;
  --ds:#5865f2;

  --t1-rgb:242,201,76;
  --t2-rgb:214,217,222;
  --t3-rgb:208,122,67;
  --t4-rgb:143,150,161;
  --t5-rgb:112,118,128;

  --side:220px;
  --gut:clamp(16px,3vw,36px);
  --b:clamp(40px,4.2vw,62px);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--ground) var(--tex-ground,none) repeat;
  background-size:64px 64px;
  image-rendering:pixelated;
  color:var(--ink);
  font-family:'Golos Text',system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;align-items:flex-start;
}
a{color:inherit;text-decoration:none}
img{display:block;image-rendering:auto}

.g1{--c:var(--t1-rgb)}
.g2{--c:var(--t2-rgb)}
.g3{--c:var(--t3-rgb)}
.g4{--c:var(--t4-rgb)}
.g5{--c:var(--t5-rgb)}

.side{
  width:var(--side);flex-shrink:0;
  position:sticky;top:0;height:100vh;
  background:#131417;border-right:1px solid var(--edge);
  display:flex;flex-direction:column;z-index:40;
}
.side-top{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.side-top img{width:36px;height:36px;image-rendering:pixelated;flex-shrink:0}
.side-top .tt{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;font-size:21px;letter-spacing:1px;line-height:1}
.side-top .tt i{color:var(--dia);font-style:normal}
.side-top .st{display:block;font-size:12.5px;color:var(--dim);margin-top:5px}

.side-scroll{flex:1;overflow-y:auto;padding:2px 10px 16px;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.grp{font-size:12.5px;color:var(--faint);padding:16px 10px 6px}
.item{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;border-radius:8px;
  color:var(--dim);font-size:14.5px;font-weight:500;
  transition:color .15s,background .15s;
}
.item:hover{color:var(--ink);background:var(--slate)}
.item.on{color:var(--ink);background:var(--slate-2);box-shadow:inset 3px 0 0 var(--dia)}
.item img{width:20px;height:20px;image-rendering:pixelated;flex-shrink:0}
.item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;flex-shrink:0}
.item.ds{color:#a7aef5}
.item.ds:hover{color:#fff;background:rgba(88,101,242,.18)}
.item.ds svg{fill:currentColor;stroke:none}

.side-foot{border-top:1px solid var(--edge);padding:10px;flex-shrink:0;position:relative}
.login{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:10px 12px;border-radius:8px;background:#4752c4;color:#fff;
  font-size:14px;font-weight:600;transition:background .15s;
}
.login:hover{background:var(--ds)}
.login svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}

.acc{position:relative}
.acc-btn{
  display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;
  background:none;border:0;border-radius:8px;padding:7px 8px;color:var(--ink);
  font-family:'Golos Text',sans-serif;font-size:14px;text-align:left;
  transition:background .15s;
}
.acc-btn:hover{background:var(--slate)}
.acc-btn img{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.acc-btn .who{min-width:0}
.acc-btn .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-btn .who small{display:block;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-btn .cv{margin-left:auto;color:var(--faint);font-size:10px;transition:transform .18s}
.acc.open .cv{transform:rotate(180deg)}
.menu-pop{
  position:absolute;left:0;right:0;bottom:calc(100% + 6px);
  background:var(--slate);border:1px solid var(--edge);border-radius:10px;padding:5px;
  opacity:0;visibility:hidden;transform:translateY(6px);
  transition:opacity .15s,transform .15s,visibility .15s;z-index:60;
}
.acc.open .menu-pop{opacity:1;visibility:visible;transform:none}
.menu-pop a,.menu-pop button{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:9px 10px;background:none;border:0;border-radius:6px;cursor:pointer;
  color:var(--ink);font-family:'Golos Text',sans-serif;font-size:14px;text-align:left;
}
.menu-pop a:hover{background:var(--slate-2)}
.menu-pop button:hover{background:rgba(224,100,90,.14);color:#f08a80}
.menu-pop svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;flex-shrink:0}

main{flex:1;min-width:0;width:100%;padding:0 var(--gut) 56px}

.topbar{padding:20px 0 0}
.search{position:relative;max-width:420px}
.search input{
  width:100%;background:var(--slate);color:var(--ink);
  border:1px solid transparent;border-radius:8px;padding:10px 36px 10px 13px;
  font-family:'Golos Text',sans-serif;font-size:15px;
  transition:border-color .15s,background .15s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--dia);background:var(--slate-2)}
.search .clr{
  position:absolute;right:2px;top:0;height:100%;width:34px;
  background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;
}
.search .clr:hover{color:var(--ink)}

.ph{
  display:flex;align-items:center;gap:12px;
  font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;
  font-size:clamp(26px,3.4vw,36px);line-height:1.1;margin:26px 0 0;
}
.ph img{width:34px;height:34px;image-rendering:pixelated}
.sh{font-size:17px;font-weight:600;margin:34px 0 12px}

.regs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.regs button{
  padding:6px 13px;border-radius:6px;cursor:pointer;
  background:var(--slate);color:var(--dim);border:0;
  font-family:'Golos Text',sans-serif;font-size:13.5px;font-weight:500;
  transition:color .15s,background .15s;
}
.regs button:hover{color:var(--ink);background:var(--slate-2)}
.regs button.on{background:var(--ink);color:var(--ground)}

.badge{
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Golos Text',system-ui,sans-serif;font-weight:700;font-size:12.5px;line-height:1;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;min-width:46px;padding:6px 7px;border-radius:5px;
  color:rgb(var(--c));background:rgba(var(--c),.13);
  box-shadow:inset 0 0 0 1px rgba(var(--c),.4);
}
.ret{font-size:11.5px;color:var(--dim);background:var(--slate-2);padding:2px 6px;border-radius:4px;flex-shrink:0}

/* подиум: ступени из блоков, игроки стоят сверху */
.stage{display:flex;justify-content:center;align-items:flex-end;margin:30px 0 0}
.step{display:flex;flex-direction:column;align-items:center;width:calc(var(--b) * 3)}
.step .who{display:flex;flex-direction:column;align-items:center;animation:appear .35s ease-out both;animation-delay:var(--d)}
.nametag{
  display:flex;align-items:center;gap:7px;max-width:calc(var(--b) * 3 + 24px);
  background:rgba(0,0,0,.5);padding:4px 7px 4px 9px;margin-bottom:8px;
  font-size:14.5px;font-weight:600;color:#fff;white-space:nowrap;
}
.nametag b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.nametag .badge{min-width:0;font-size:11.5px;padding:4px 5px}
.step .who img{height:calc(var(--b) * 2.5);width:auto;position:relative;z-index:1;margin-bottom:-3px;object-fit:contain}
.step .who:hover .nametag{background:rgba(0,0,0,.72)}
.blocks{width:100%;box-shadow:0 18px 26px -16px rgba(0,0,0,.85)}
.blk{
  height:var(--b);position:relative;
  background-size:var(--b) var(--b);image-rendering:pixelated;
  animation:drop .42s cubic-bezier(.3,.7,.35,1) both;animation-delay:var(--d);
}
.gold .blk{background-color:#f2c632;background-image:var(--tex-gold,none)}
.iron .blk{background-color:#d8d8d8;background-image:var(--tex-iron,none)}
.copper .blk{background-color:#c4693a;background-image:var(--tex-copper,none)}
.blk .rk{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:'Pixelify Sans',system-ui,sans-serif;font-size:calc(var(--b) * .56);
  color:rgba(0,0,0,.38);text-shadow:0 2px 0 rgba(255,255,255,.28);
}

@keyframes drop{
  0%{transform:translateY(-80px);opacity:0}
  55%{opacity:1}
  78%{transform:translateY(5px)}
  100%{transform:none;opacity:1}
}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.lb{display:flex;flex-direction:column;gap:4px;margin-top:26px}
.row{
  display:grid;grid-template-columns:42px 1fr auto 62px;align-items:center;gap:12px;
  height:54px;padding:0 14px 0 10px;border-radius:8px;
  background:var(--slate);transition:background .15s;
}
.row:hover{background:var(--slate-2)}
.row.t1{box-shadow:inset 3px 0 0 rgb(var(--t1-rgb))}
.row.t2{box-shadow:inset 3px 0 0 rgb(var(--t2-rgb))}
.row.t3{box-shadow:inset 3px 0 0 rgb(var(--t3-rgb))}
.row .pos{font-family:'Golos Text',system-ui,sans-serif;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:var(--faint);text-align:center}
.row.t1 .pos{color:rgb(var(--t1-rgb))}
.row.t2 .pos{color:rgb(var(--t2-rgb))}
.row.t3 .pos{color:rgb(var(--t3-rgb))}
.row .who{display:flex;align-items:center;gap:12px;min-width:0}
.row .who img{width:38px;height:38px;flex-shrink:0;object-fit:contain}
.row .who b{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .reg{font-size:13px;color:var(--dim)}

.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:22px}
.col{
  background:var(--slate);border-radius:12px;
  display:flex;flex-direction:column;max-height:560px;min-height:0;
  overflow:hidden;position:relative;
}
.col-hd{
  display:flex;align-items:center;gap:9px;flex-shrink:0;
  padding:13px 14px 12px;border-bottom:2px solid rgba(var(--c),.5);
  font-family:'Golos Text',system-ui,sans-serif;font-weight:700;font-size:15px;color:rgb(var(--c));
}
.col-hd .dot{width:8px;height:8px;background:rgb(var(--c));flex-shrink:0}
.col-hd i{margin-left:auto;font-family:'Golos Text',sans-serif;font-style:normal;font-size:13px;color:var(--dim)}
.col-body{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px;
  scrollbar-width:thin;scrollbar-color:var(--edge) transparent;
}
.col-body::-webkit-scrollbar{width:8px}
.col-body::-webkit-scrollbar-thumb{background:var(--edge);border-radius:4px}
.slot{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;transition:background .15s}
.slot:hover{background:var(--slate-2)}
.slot img{width:30px;height:30px;flex-shrink:0;object-fit:contain}
.slot>span{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .badge{margin-left:auto;min-width:0;font-size:11.5px;padding:4px 6px}
.slot.split{margin-top:9px;position:relative}
.slot.split::before{content:'';position:absolute;left:8px;right:8px;top:-5px;height:1px;background:var(--edge)}
.empty{padding:20px 8px;color:var(--faint);font-size:13.5px;text-align:center}
.col::after{
  content:'';position:absolute;left:0;right:8px;bottom:0;height:40px;pointer-events:none;
  background:linear-gradient(transparent,var(--slate));transition:opacity .25s;
}
.col.end::after{opacity:0}

.feed{display:flex;flex-direction:column;gap:4px;margin-top:22px}
.fi{
  display:flex;align-items:center;gap:12px;
  padding:8px 16px 8px 10px;border-radius:8px;background:var(--slate);transition:background .15s;
}
.fi:hover{background:var(--slate-2)}
.fi img{width:34px;height:34px;flex-shrink:0;object-fit:contain}
.fi .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .mv{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.fi .old{opacity:.45}
.fi .arr{font-size:11px;line-height:1;color:var(--dim)}
.fi.up .arr{color:var(--up)}
.fi.down .arr{color:var(--down)}
.fi.new .arr{color:var(--dia)}
.fi .when{font-size:13px;color:var(--dim);min-width:96px;text-align:right;flex-shrink:0}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:14.5px;margin:24px 0 14px}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.profile{
  display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap;
  padding:26px 30px;border-radius:12px;
  background:radial-gradient(ellipse at 12% 0%,rgba(var(--c),.16),transparent 60%),var(--slate);
}
.profile>img{height:220px;object-fit:contain}
.profile h1{font-family:'Pixelify Sans',system-ui,sans-serif;font-size:clamp(24px,3vw,32px);font-weight:600;word-break:break-all}
.facts{display:flex;gap:32px;margin-top:18px;flex-wrap:wrap}
.fact small{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
.fact b{font-family:'Golos Text',system-ui,sans-serif;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}

.hist{display:flex;flex-direction:column;gap:4px}
.hi{
  display:grid;grid-template-columns:10px auto 1fr auto;align-items:center;gap:14px;
  padding:11px 16px;border-radius:8px;background:var(--slate);
}
.hi .dot{width:8px;height:8px;background:var(--edge)}
.hi.now .dot{background:var(--dia)}
.hi .txt{font-size:14.5px;color:var(--dim)}
.hi.now .txt{color:var(--ink)}
.hi .dt{font-size:13px;color:var(--faint)}

.bind{background:var(--slate);border-radius:12px;padding:24px;margin-top:22px;max-width:560px}
.bind p{color:var(--dim);font-size:15px;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bind p b{color:var(--ink)}
.bind .rowf{display:flex;gap:8px;flex-wrap:wrap}
.bind input{
  flex:1;min-width:180px;background:var(--ground);color:var(--ink);
  border:1px solid var(--edge);border-radius:8px;padding:10px 12px;
  font-family:'Golos Text',sans-serif;font-size:15px;
}
.bind input:focus{outline:none;border-color:var(--dia)}
.bind button{
  padding:10px 20px;border-radius:8px;cursor:pointer;border:0;
  background:var(--ink);color:var(--ground);
  font-family:'Golos Text',sans-serif;font-size:14.5px;font-weight:600;
}
.bind button:hover{background:#fff}
.bind .msg{margin-top:12px;font-size:14px;min-height:20px}
.bind .msg.err{color:var(--down)}
.bind .msg.ok{color:var(--up)}

.more{color:var(--faint);font-size:13.5px;text-align:center;margin:16px 0 0}
.nores{
  background:var(--slate);border-radius:12px;padding:30px 22px;margin-top:22px;
  color:var(--dim);font-size:15px;text-align:center;
}
.nores a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

@keyframes pulse{0%,100%{background-color:rgba(255,255,255,.03)}50%{background-color:rgba(255,255,255,.08)}}
img[data-skin]:not([data-ok]){animation:pulse 1.1s ease-in-out infinite;border-radius:6px}

:focus-visible{outline:2px solid var(--dia);outline-offset:2px}

@media(max-width:1080px){
  .cols{grid-template-columns:repeat(3,minmax(0,1fr))}
  .col{max-height:480px}
}
@media(max-width:860px){
  body{flex-direction:column;align-items:stretch}
  .side{width:100%;height:auto;position:sticky;top:0;border-right:0;border-bottom:1px solid var(--edge)}
  .side-top{padding:12px var(--gut)}
  .side-scroll{display:flex;align-items:center;gap:2px;padding:0 var(--gut) 10px;overflow-x:auto;overflow-y:hidden}
  .grp{display:none}
  .item{padding:8px 12px;white-space:nowrap;flex-shrink:0}
  .item.on{box-shadow:inset 0 -2px 0 var(--dia)}
  .side-foot{position:absolute;top:12px;right:var(--gut);border:0;padding:0;width:auto;max-width:52vw}
  .acc-btn .who,.acc-btn .cv{display:none}
  .menu-pop{left:auto;right:0;width:190px;bottom:auto;top:calc(100% + 6px)}
  .login{padding:8px 10px;font-size:0;gap:0}
  .login svg{width:20px;height:20px}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .profile>img{height:170px}
}
@media(max-width:560px){
  :root{--b:31px}
  .cols{grid-template-columns:1fr}
  .col{max-height:420px}
  .nametag{font-size:12px;padding:3px 6px}
  .nametag .badge{display:none}
  .row{grid-template-columns:34px 1fr 58px;gap:10px}
  .row .reg{display:none}
  .fi .when{display:none}
  .hi{grid-template-columns:10px auto 1fr}
  .hi .dt{grid-column:2 / -1}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>

const API = ''; // пусто = тот же домен
// на зеркале GitHub Pages сервера нет — данные лежат рядом файлом, его выкладывает бот

const DISCORD = 'https://discord.gg/aNDmTh5hP';

const KIT_NAME = 'DIACART';
const TIER_PTS = {HT1:60,LT1:45,HT2:30,LT2:20,HT3:10,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1};

const MOCK = [
  {name:'MorozBS', region:'RU', tier:'HT1', history:[

];

const STEVE = 'MHF_Steve';
// на основном сайте скины раздаёт бот (кэш), на зеркале и без сервера — напрямую от Visage
const SKIN_PROXY = !MIRROR && location.protocol !== 'file:';
const bust = n => SKIN_PROXY ? `/skin/bust/${encodeURIComponent(n)}` : `https://visage.surgeplay.com/bust/160/${encodeURIComponent(n)}`;
const full = n => SKIN_PROXY ? `/skin/full/${encodeURIComponent(n)}` : `https://visage.surgeplay.com/full/512/${encodeURIComponent(n)}`;
// Visage отбивает часть запросов, когда скинов на странице много:
// сначала повторяем с паузой, потом показываем Стива
function skinChain(img){
  const n = img.dataset.name, isFull = img.dataset.skin === 'full';
  const own = isFull ? full(n) : bust(n);
  return [
    {src: own + '?r=1', wait: 1500},
    {src: own + '?r=2', wait: 4000},
    {src: isFull ? full(STEVE) : bust(STEVE), wait: 0},
    {src: `https://mc-heads.net/${isFull ? 'body' : 'head'}/${STEVE}/${isFull ? 256 : 128}`, wait: 0},
  ];
}

function nextSkin(img){
  if(!img.isConnected) return;
  const chain = skinChain(img);
  const i = +(img.dataset.fb || 0);
  if(i >= chain.length){ img.style.visibility = 'hidden'; img.dataset.ok = '1'; return; }
  img.dataset.fb = i + 1;

  setTimeout(() => {
    if(!img.isConnected || img.dataset.ok) return;
    img.src = chain[i].src;
    // запрос завис без ответа — не ждём вечно
    const armed = img.src;
    setTimeout(() => {
      if(img.isConnected && !img.dataset.ok && img.src === armed) nextSkin(img);
    }, 9000);
  }, chain[i].wait);
}

addEventListener('error', e => {
  const img = e.target;
  if(img.tagName === 'IMG' && img.dataset.skin) nextSkin(img);
}, true);

// первый запрос тоже может повиснуть — засекаем время, когда скин появился на экране
// (раньше нельзя: из-за loading="lazy" картинки ниже экрана ещё и не начинали грузиться)
const skinWatch = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
  for(const e of entries){
    if(!e.isIntersecting) continue;
    const img = e.target;
    skinWatch.unobserve(img);
    const src = img.src;
    setTimeout(() => {
      if(img.isConnected && !img.dataset.ok && !img.dataset.fb && img.src === src) nextSkin(img);
    }, 12000);
  }
}) : null;

function watchSkins(){
  if(skinWatch) document.querySelectorAll('img[data-skin]:not([data-ok])').forEach(i => skinWatch.observe(i));
}
const skinImg = (n, kind) =>
  `<img src="${kind==='full'?full(n):bust(n)}" data-skin="${kind||'bust'}" data-name="${esc(n)}" alt="" loading="lazy">`;

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pts = p => TIER_PTS[p.tier] || 0;
const idx = t => TIER_ORDER.indexOf(t);

const badge = t => `<span class="badge g${t[2]}">${t}</span>`;
const retTag = p => p.retired ? '<span class="ret" title="Retired">R</span>' : '';
const nores = html => `<div class="nores">${html}</div>`;
const regText = r => r && r !== '—' ? esc(r) : '';

function blockTex(base, hi, lo, seed){
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const x = c.getContext('2d');
  let s = seed >>> 0;
  const rnd = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  for(let i = 0; i < 16; i++) for(let j = 0; j < 16; j++){
    x.fillStyle = base[Math.floor(rnd() * base.length)];
    x.fillRect(i, j, 1, 1);
  }
  if(hi){
    x.fillStyle = hi; x.fillRect(0, 0, 16, 1); x.fillRect(0, 0, 1, 16);
    x.fillStyle = lo; x.fillRect(0, 15, 16, 1); x.fillRect(15, 0, 1, 16);
  }
  return `url("${c.toDataURL()}")`;
}

function paintTextures(){
  try{
    const r = document.documentElement.style;
    r.setProperty('--tex-gold',   blockTex(['#f7d84a','#fbe46a','#f2c632','#f5d040','#eec22c'], '#fff4a3', '#b8860b', 7));
    r.setProperty('--tex-iron',   blockTex(['#dedede','#e8e8e8','#d2d2d2','#cacaca','#d9d9d9'], '#f7f7f7', '#8f8f8f', 11));
    r.setProperty('--tex-copper', blockTex(['#c86f3d','#d47d48','#b96034','#c4693a','#cf7642'], '#eba374', '#7a3b1d', 13));
    r.setProperty('--tex-ground', blockTex(['#18191d','#1a1b1f','#16171b','#1b1c21','#191a1e'], null, null, 3));
  }catch(e){}
}

function ago(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if(d <= 0) return 'сегодня';
  if(d === 1) return 'вчера';
  if(d < 7) return `${d} дн. назад`;
  if(d < 31) return `${Math.floor(d / 7)} нед. назад`;
  return new Date(iso).toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
}

function regionBar(){
  const list = [...new Set(players.map(p => p.region))].filter(r => r && r !== '—').sort();
  if(list.length < 2) return '';
  const btn = (v, label) =>
    `<button type="button" data-reg="${v}" class="${region === v ? 'on' : ''}">${label}</button>`;
  return `<div class="regs">${btn('ALL', 'Все')}${list.map(r => btn(r, r)).join('')}</div>`;
}

function renderMenu(on){
  const li = (href, label, ico, cls) =>
    `<a href="${href}" class="item ${cls || ''} ${on === href ? 'on' : ''}"${cls === 'ds' ? ' target="_blank" rel="noopener"' : ''}>${ico}${label}</a>`;

  menu.innerHTML =
    `<div class="grp">Режимы</div>` +
    li('#/', 'Overall', IC.overall) +
    li('#/tierlist', 'DiaCart', `<img src="${CART_ICO}" alt="">`) +
    `<div class="grp">Ещё</div>` +
    li('#/results', 'Results', IC.results) +
    li(DISCORD, 'Discord', IC.ds, 'ds');
}

function feedRows(list){
  return list.map(c => `
    <a href="#/player/${encodeURIComponent(c.p.name)}" class="fi ${c.dir}">
      ${skinImg(c.p.name)}
      <span class="nm">${esc(c.p.name)}</span>
      <span class="mv">
        ${c.from ? `<span class="old">${badge(c.from)}</span>` : ''}
        <span class="arr">${c.dir === 'up' ? '▲' : c.dir === 'down' ? '▼' : '★'}</span>
        ${badge(c.to)}
      </span>
      <span class="when">${ago(c.date)}</span>
    </a>`).join('');
}

function podium(all){
  const MAT = {1:'gold', 2:'iron', 3:'copper'};
  const H = {1:3, 2:2, 3:1};
  const STEP = 95;

  let t = 0;
  const rowDelay = {};
  for(const r of [3, 2, 1]){
    rowDelay[r] = [];
    for(let k = 0; k < H[r]; k++){ rowDelay[r].push(t); t += STEP; }
  }
  const playerDelay = {3: t + 40, 2: t + 150, 1: t + 260};

  const step = r => {
    const p = all[r - 1];
    const rows = Array.from({length: H[r]}, (_, k) => {
      const d = rowDelay[r][H[r] - 1 - k];
      return `<div class="blk" style="--d:${d}ms">${k === 0 ? `<span class="rk">${r}</span>` : ''}</div>`;
    }).join('');

    const who = p ? `
      <a href="#/player/${encodeURIComponent(p.name)}" class="who" style="--d:${playerDelay[r]}ms">
        <span class="nametag"><b>${esc(p.name)}</b>${badge(p.tier)}</span>
        ${skinImg(p.name)}
      </a>` : '';

    return `<div class="step ${MAT[r]}">${who}<div class="blocks">${rows}</div></div>`;
  };

  return `<div class="stage">${step(2)}${step(1)}${step(3)}</div>`;
}

function leaderboard(){
  const s = query();
  const all = ranked();
  const found = all.map((p, i) => ({p, rank: i + 1})).filter(x => nameMatch(x.p, s));

  const head = `<h1 class="ph">Overall</h1>` + regionBar();
  if(!all.length) return head + nores(region === 'ALL'
    ? 'В тир-листе пока никого нет. Игроки появятся после первых тестов.'
    : 'В этом регионе пока никого нет.');
  if(s && !found.length) return head + nores(`Никого не нашлось по запросу «${esc(s)}».`);

  const rows = found.slice(0, 100).map(({p, rank}) => `
    <a href="#/player/${encodeURIComponent(p.name)}" class="row${rank <= 3 ? ' t' + rank : ''}">
      <span class="pos">${rank}</span>
      <span class="who">${skinImg(p.name)}<b>${esc(p.name)}</b>${retTag(p)}</span>
      <span class="reg">${regText(p.region)}</span>
      ${badge(p.tier)}
    </a>`).join('');

  return head
    + (s ? `<h2 class="sh">Найдено: ${found.length}</h2>` : podium(all))
    + `<div class="lb">${rows}</div>`;
}

function tierList(){
  const s = query();
  const pool = visible();

  const cols = [1, 2, 3, 4, 5].map(n => {
    const ht = pool.filter(p => p.tier === 'HT' + n);
    const lt = pool.filter(p => p.tier === 'LT' + n);
    const list = [...ht, ...lt];

    const body = list.length
      ? list.map((p, i) => `
          <a href="#/player/${encodeURIComponent(p.name)}" class="slot${i === ht.length && ht.length ? ' split' : ''}">
            ${skinImg(p.name)}<span>${esc(p.name)}</span>${retTag(p)}${badge(p.tier)}
          </a>`).join('')
      : `<div class="empty">${s ? 'Нет совпадений' : 'Пока никого'}</div>`;

    return `<div class="col g${n}">
      <div class="col-hd"><span class="dot"></span>Tier ${n}<i>${list.length}</i></div>
      <div class="col-body">${body}</div>
    </div>`;
  }).join('');

  return `<h1 class="ph"><img src="${CART_ICO}" alt="">DiaCart</h1>`
    + regionBar()
    + `<div class="cols">${cols}</div>`;
}

function results(){
  const s = query();
  const log = changeLog().filter(c => nameMatch(c.p, s));
  const head = `<h1 class="ph">Results</h1>` + regionBar();

  if(!log.length){
    return head + nores(s
      ? `Нет изменений по запросу «${esc(s)}».`
      : 'Изменений пока нет. Они появятся здесь после первого тир-теста.');
  }
  const more = log.length > 100
    ? `<p class="more">Показаны последние 100 из ${log.length}. Найди игрока через поиск, чтобы увидеть остальные.</p>`
    : '';
  return head + `<div class="feed">${feedRows(log.slice(0, 100))}</div>` + more;
}

function playerPage(name){
  const p = players.find(x => x.name.toLowerCase() === name.toLowerCase());
  if(!p) return notFound(`Игрока «${esc(name)}» нет в тир-листе.`);

  const rank = players.slice().sort((a, b) => pts(b) - pts(a)).findIndex(x => x.name === p.name) + 1;
  const h = p.history && p.history.length ? p.history : [{tier: p.tier, date: null}];

  const hist = h.map((e, i) => {
    const prev = h[i + 1];
    const txt = !prev ? 'Первый тир'
      : idx(e.tier) < idx(prev.tier) ? `Повышение с ${prev.tier}`
      : `Понижение с ${prev.tier}`;
    return `<div class="hi${i === 0 ? ' now' : ''}">
      <span class="dot"></span>${badge(e.tier)}
      <span class="txt">${txt}</span>
      <span class="dt">${e.date ? fmt(e.date) : ''}</span>
    </div>`;
  }).join('');

  return `
  <a href="#/" class="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Назад</a>
  <div class="profile g${p.tier[2]}">
    ${skinImg(p.name, 'full')}
    <div>
      <h1>${esc(p.name)}</h1>
      <div class="facts">
        <div class="fact"><small>Тир</small><b style="color:rgb(var(--c))">${p.tier}</b></div>
        <div class="fact"><small>Место</small><b>${rank}</b></div>
        ${regText(p.region) ? `<div class="fact"><small>Регион</small><b>${regText(p.region)}</b></div>` : ''}
        ${p.retired ? '<div class="fact"><small>Статус</small><b style="color:var(--dim)">Retired</b></div>' : ''}
      </div>
    </div>
  </div>
  <h2 class="sh">История тира</h2>
  <div class="hist">${hist}</div>`;
}

function changeLog(){
  const out = [];
  for(const p of players.filter(inRegion)){
    const h = p.history || [];
    h.forEach((e, i) => {
      const prev = h[i+1];
      out.push({
        p, date: e.date, to: e.tier, from: prev ? prev.tier : null,
        dir: !prev ? 'new' : (idx(e.tier) < idx(prev.tier) ? 'up' : 'down')
      });
    });
  }
  return out.sort((a,b)=> new Date(b.date) - new Date(a.date));
}

  });
}

let me = null;

const dcAvatar = u => u.avatar
  ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=64`
  : 'https://cdn.discordapp.com/embed/avatars/0.png';

async function loadMe(){
  try{
    const r = await fetch(API + '/api/me', {credentials:'include'});
    if(r.status === 404){ auth.hidden = true; return; }
    me = r.ok ? await r.json() : null;
  }catch(e){ me = null; }
  renderAuth();
}

function renderAuth(){
  if(!me){
    auth.innerHTML = `<a class="login" href="${API}/auth/discord">${IC.ds}Войти через Discord</a>`;
    return;
  }
  auth.innerHTML = `
  <div class="acc" id="acc">
    <button class="acc-btn" type="button" id="accBtn">
      <img src="${dcAvatar(me)}" alt="">
      <span class="who"><b>${esc(me.username)}</b><small>${me.mc ? esc(me.mc) : 'ник не привязан'}</small></span>
      <span class="cv">▲</span>
    </button>
    <div class="menu-pop">
      <a href="#/me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Мой профиль</a>
      <button type="button" id="logout"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M15 8l4 4-4 4M19 12H9"/></svg>Выйти</button>
    </div>
  </div>`;

  accBtn.addEventListener('click', e => { e.stopPropagation(); acc.classList.toggle('open'); });
  logout.addEventListener('click', async () => {
    try{ await fetch(API + '/auth/logout', {method:'POST', credentials:'include'}); }catch(e){}
    me = null; renderAuth(); router();
  });
}

addEventListener('click', () => {
  const a = document.getElementById('acc');
  if(a) a.classList.remove('open');
});

function wireMePage(){
  const btn = document.getElementById('bindBtn');
  if(!btn) return;
  btn.addEventListener('click', async () => {
    const nick = document.getElementById('mcNick').value.trim();
    const msg  = document.getElementById('bindMsg');
    if(!/^[A-Za-z0-9_]{3,16}$/.test(nick)){
      msg.className = 'msg err';
      msg.textContent = 'Ник — от 3 до 16 символов: латиница, цифры и _';
      return;
    }
    try{
      const r = await fetch(API + '/api/link', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mc: nick})
      });
      const data = await r.json();
      if(!r.ok) throw new Error(data.error || 'Не удалось сохранить');
      me.mc = data.mc;
      msg.className = 'msg ok';
      msg.textContent = 'Ник сохранён';
      renderAuth();
    }catch(e){
      msg.className = 'msg err';
      msg.textContent = e.message;
    }
  });
}

function router(){
  const parts = (location.hash || '#/').split('/');
  const seg = parts[1] || '', arg = parts[2] || '';
  const menuFor = {tierlist:'#/tierlist', results:'#/results', me:'#/me', player:''};
  const on = seg in menuFor ? menuFor[seg] : '#/';

  let html = '';
  if(!ready)                          html = '<div class="nores">Загрузка тир-листа…</div>';
  else if(loadFailed && seg !== 'me') html = nores('Не удалось загрузить тир-лист. Обнови страницу — если не помогает, возможно, провайдер плохо открывает сайт: попробуй другую сеть или VPN.');
  else if(seg === 'tierlist')         html = tierList();
  else if(seg === 'results')          html = results();
  else if(seg === 'me')               html = mePage();
  else if(seg === 'player')           html = playerPage(decodeURIComponent(arg));
  else                                html = leaderboard();

  app.innerHTML = html;
  window.__ready = true;
  renderMenu(on);
  markShortColumns();
  watchSkins();
  wireMePage();
}

function normalize(list){
  return list
    .filter(p => p && p.name && /^(HT|LT)[1-5]$/i.test(p.tier || ''))
    .map(p => ({
      name: String(p.name),
      region: p.region || '—',
      tier: String(p.tier).toUpperCase(),
      retired: !!p.retired,
      history: (Array.isArray(p.history) && p.history.length
                  ? p.history.filter(h => h && h.tier)
                  : [{tier: String(p.tier).toUpperCase(), date: null}])
        .map(h => ({tier: String(h.tier).toUpperCase(), date: h.date || null}))
        .sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0))
    }));
}

async function load(){
  try{
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctrl && setTimeout(() => ctrl.abort(), 15000);
    const r = await fetch(dataUrl(), {credentials:'include', signal: ctrl ? ctrl.signal : undefined});
    if(timer) clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = normalize(await r.json());
    const changed = JSON.stringify(data) !== JSON.stringify(players);
    players = data;
    loadFailed = false;
    // на странице профиля не перерисовываем — там может быть недописанный ник в поле
    if(!ready || (changed && !location.hash.startsWith('#/me'))){ ready = true; router(); }
  }catch(e){
    console.warn('не удалось загрузить тир-лист:', e.message);
    if(!ready){ ready = true; loadFailed = !OFFLINE; router(); }
  }
}
load();
setInterval(() => { if(!OFFLINE && !document.hidden) load(); }, 30000);

addEventListener('hashchange', () => { router(); scrollTo(0,0); });
paintTextures();
router();
loadMe();
</script>
<script>
setTimeout(function(){
  if(window.__ready) return;
  var a = document.getElementById('app');
  if(a) a.innerHTML = '<div class="nores">Сайт не смог запуститься в этом браузере. Обнови браузер или открой ссылку в Chrome.</div>';
}, 8000);
</script>
</body>
