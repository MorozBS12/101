<style>
:root{
  --ground:#18191d;
  --slate:#212329;
  --slate-2:#292c33;
  --edge:#33363e;
  --ink:#ece9e3;
  --dim:#9c9fa6;
  --faint:#62666e;
  --dia:#5fd8e0;
  --up:#6cc070;
  --down:#e0645a;
  --ds:#5865f2;

  --t1-rgb:242,201,76;
  --t2-rgb:214,217,222;
  --t3-rgb:208,122,67;
  --t4-rgb:143,150,161;
  --t5-rgb:112,118,128;

  --side:220px;
  --gut:clamp(16px,3vw,36px);
  --b:clamp(40px,4.2vw,62px);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--ground) var(--tex-ground,none) repeat;
  background-size:64px 64px;
  image-rendering:pixelated;
  color:var(--ink);
  font-family:'Golos Text',system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;align-items:flex-start;
}
a{color:inherit;text-decoration:none}
img{display:block;image-rendering:auto}

.g1{--c:var(--t1-rgb)}
.g2{--c:var(--t2-rgb)}
.g3{--c:var(--t3-rgb)}
.g4{--c:var(--t4-rgb)}
.g5{--c:var(--t5-rgb)}

.side{
  width:var(--side);flex-shrink:0;
  position:sticky;top:0;height:100vh;
  background:#131417;border-right:1px solid var(--edge);
  display:flex;flex-direction:column;z-index:40;
}
.side-top{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.side-top img{width:36px;height:36px;image-rendering:pixelated;flex-shrink:0}
.side-top .tt{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;font-size:21px;letter-spacing:1px;line-height:1}
.side-top .tt i{color:var(--dia);font-style:normal}
.side-top .st{display:block;font-size:12.5px;color:var(--dim);margin-top:5px}

.side-scroll{flex:1;overflow-y:auto;padding:2px 10px 16px;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.grp{font-size:12.5px;color:var(--faint);padding:16px 10px 6px}
.item{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;border-radius:8px;
  color:var(--dim);font-size:14.5px;font-weight:500;
  transition:color .15s,background .15s;
}
.item:hover{color:var(--ink);background:var(--slate)}
.item.on{color:var(--ink);background:var(--slate-2);box-shadow:inset 3px 0 0 var(--dia)}
.item img{width:20px;height:20px;image-rendering:pixelated;flex-shrink:0}
.item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;flex-shrink:0}
.item.ds{color:#a7aef5}
.item.ds:hover{color:#fff;background:rgba(88,101,242,.18)}
.item.ds svg{fill:currentColor;stroke:none}

.side-foot{border-top:1px solid var(--edge);padding:10px;flex-shrink:0;position:relative}
.login{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:10px 12px;border-radius:8px;background:#4752c4;color:#fff;
  font-size:14px;font-weight:600;transition:background .15s;
}
.login:hover{background:var(--ds)}
.login svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}

.acc{position:relative}
.acc-btn{
  display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;
  background:none;border:0;border-radius:8px;padding:7px 8px;color:var(--ink);
  font-family:'Golos Text',sans-serif;font-size:14px;text-align:left;
  transition:background .15s;
}
.acc-btn:hover{background:var(--slate)}
.acc-btn img{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.acc-btn .who{min-width:0}
.acc-btn .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-btn .who small{display:block;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-btn .cv{margin-left:auto;color:var(--faint);font-size:10px;transition:transform .18s}
.acc.open .cv{transform:rotate(180deg)}
.menu-pop{
  position:absolute;left:0;right:0;bottom:calc(100% + 6px);
  background:var(--slate);border:1px solid var(--edge);border-radius:10px;padding:5px;
  opacity:0;visibility:hidden;transform:translateY(6px);
  transition:opacity .15s,transform .15s,visibility .15s;z-index:60;
}
.acc.open .menu-pop{opacity:1;visibility:visible;transform:none}
.menu-pop a,.menu-pop button{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:9px 10px;background:none;border:0;border-radius:6px;cursor:pointer;
  color:var(--ink);font-family:'Golos Text',sans-serif;font-size:14px;text-align:left;
}
.menu-pop a:hover{background:var(--slate-2)}
.menu-pop button:hover{background:rgba(224,100,90,.14);color:#f08a80}
.menu-pop svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;flex-shrink:0}

main{flex:1;min-width:0;width:100%;padding:0 var(--gut) 56px}

.topbar{padding:20px 0 0}
.search{position:relative;max-width:420px}
.search input{
  width:100%;background:var(--slate);color:var(--ink);
  border:1px solid transparent;border-radius:8px;padding:10px 36px 10px 13px;
  font-family:'Golos Text',sans-serif;font-size:15px;
  transition:border-color .15s,background .15s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--dia);background:var(--slate-2)}
.search .clr{
  position:absolute;right:2px;top:0;height:100%;width:34px;
  background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;
}
.search .clr:hover{color:var(--ink)}

.ph{
  display:flex;align-items:center;gap:12px;
  font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;
  font-size:clamp(26px,3.4vw,36px);line-height:1.1;margin:26px 0 0;
}
.ph img{width:34px;height:34px;image-rendering:pixelated}
.ph svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;flex-shrink:0;color:var(--dim)}
.sh{font-size:17px;font-weight:600;margin:34px 0 12px}

.regs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
.regs button{
  padding:6px 13px;border-radius:6px;cursor:pointer;
  background:var(--slate);color:var(--dim);border:0;
  font-family:'Golos Text',sans-serif;font-size:13.5px;font-weight:500;
  transition:color .15s,background .15s;
}
.regs button:hover{color:var(--ink);background:var(--slate-2)}
.regs button.on{background:var(--ink);color:var(--ground)}

.badge{
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Golos Text',system-ui,sans-serif;font-weight:700;font-size:12.5px;line-height:1;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;min-width:46px;padding:6px 7px;border-radius:5px;
  color:rgb(var(--c));background:rgba(var(--c),.13);
  box-shadow:inset 0 0 0 1px rgba(var(--c),.4);
}
.ret{font-size:11.5px;color:var(--dim);background:var(--slate-2);padding:2px 6px;border-radius:4px;flex-shrink:0}

/* подиум: ступени из блоков, игроки стоят сверху */
.stage{display:flex;justify-content:center;align-items:flex-end;margin:30px 0 0}
.step{display:flex;flex-direction:column;align-items:center;width:calc(var(--b) * 3)}
.step .who{display:flex;flex-direction:column;align-items:center;animation:appear .35s ease-out both;animation-delay:var(--d)}
.nametag{
  display:flex;align-items:center;gap:7px;max-width:calc(var(--b) * 3 + 24px);
  background:rgba(0,0,0,.5);padding:4px 7px 4px 9px;margin-bottom:8px;

.blk{

.lb{display:flex;flex-direction:column;gap:4px;margin-top:26px}

.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:22px}
.col{

}
.col-hd{

}

}

.empty{padding:20px 8px;color:var(--faint);font-size:13.5px;text-align:center}
.col::after{
  content:'';position:absolute;left:0;right:8px;bottom:0;height:40px;pointer-events:none;

}

.feed{display:flex;flex-direction:column;gap:4px;margin-top:22px}

  display:flex;align-items:center;gap:12px;

}

.fi img{width:34px;height:34px;flex-shrink:0;object-fit:contain}

.profile{

}
.profile.hasbg{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(90deg,rgba(6,6,12,.35),rgba(6,6,12,.1) 45%,rgba(6,6,12,.3)),var(--pbg) center 55%/cover;image-rendering:auto;--glow:255,170,60;--fog:255,120,40}

.profile.th-cave{--glow:90,240,230;--fog:120,200,220}
.profile.th-jungle{--glow:255,220,140;--fog:120,200,120}
.profile.th-icespikes{--glow:150,200,255;--fog:120,220,220}

.profile.th-sky{--glow:255,200,120;--fog:255,220,180}
.profile.th-ocean{--glow:80,220,255;--fog:60,160,220}

.profile.hasbg>img,.profile.hasbg h1,.profile.hasbg .facts,.profile.hasbg .ktiers{image-rendering:auto}
.profile.hasbg .fact,.profile.hasbg .ktiers>*{background:rgba(16,14,24,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.profile.hasbg h1{text-shadow:0 2px 0 rgba(0,0,0,.5)}
.profile.hasbg>img,.profile.hasbg>div{position:relative;z-index:2}
.pfx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;image-rendering:pixelated}
.pglow{position:absolute;z-index:1;left:0;bottom:-10%;width:340px;height:120%;pointer-events:none;background:radial-gradient(closest-side,rgba(var(--glow),.26),transparent);animation:pglow 5s ease-in-out infinite}
.pfog{position:absolute;z-index:1;left:-50%;right:-50%;bottom:-20px;height:55%;pointer-events:none;opacity:.55;background:radial-gradient(40% 60% at 20% 80%,rgba(var(--fog),.28),transparent 70%),radial-gradient(35% 50% at 60% 90%,rgba(var(--fog),.22),transparent 70%),radial-gradient(30% 55% at 85% 75%,rgba(var(--fog),.2),transparent 70%);animation:pfog 26s linear infinite alternate}
@keyframes pfog{to{transform:translateX(18%)}}
@keyframes pglow{50%{opacity:.55;transform:scale(.94)}}
@media(max-width:560px){.pglow{width:200px}}
@media(prefers-reduced-motion:reduce){.pglow,.pfog{animation:none}}
.profile>img{height:220px;object-fit:contain}

.sug a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;font-size:14.5px;color:var(--dim)}
.sug a img{width:30px;height:30px;object-fit:contain;flex-shrink:0}
.sug a span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug a b{color:var(--ink);font-weight:600}
.sug a .badge{min-width:0;font-size:11.5px;padding:4px 6px}
.sug a:hover,.sug a.at{background:var(--slate-2);color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.sug-no{padding:10px;color:var(--faint);font-size:14px}
/* --- Правила --- */
.rules{max-width:880px}
.rtabs{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 6px;padding:4px;background:var(--slate);border-radius:10px;width:max-content;max-width:100%}
.rtabs a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:7px;color:var(--dim);text-decoration:none;font-size:14px;font-weight:500;transition:color .15s,background .15s}
.rtabs a img{width:20px;height:20px;image-rendering:pixelated}
.rtabs a:hover{color:var(--ink)}
.rtabs a.on{background:var(--slate-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.md{font-size:15.5px;line-height:1.65;color:#d6d4cf}
.md h2{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;font-size:26px;color:var(--ink);margin:30px 0 12px;line-height:1.2}
.md h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px;font-weight:600;color:var(--ink);margin:30px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--edge)}
.md h3 .arr{color:var(--faint);font-weight:500}
.md p{margin:8px 0}
.md b{color:var(--ink);font-weight:600}
.md ul{list-style:none;margin:8px 0}
.md ul li{position:relative;padding:3px 0 3px 22px}
.md ul li:before{content:'';position:absolute;left:4px;top:.72em;width:6px;height:6px;background:var(--faint)}
.md ul li.ico{padding-left:0;display:flex;gap:10px;align-items:flex-start}
.md ul li.ico:before{display:none}
.md ul li.ico .it{flex-shrink:0;margin-top:1px}
.md ol{list-style:none;margin:10px 0;display:grid;gap:8px}
.md ol li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px 14px;background:var(--slate);border-radius:8px}
.md ol li>i{font-style:normal;font-family:'Pixelify Sans',system-ui,sans-serif;font-size:17px;width:30px;height:30px;display:grid;place-items:center;background:var(--slate-2);border-radius:6px;color:var(--dim)}
.md blockquote{margin:14px 0;padding:12px 16px;border-left:3px solid var(--dia);background:rgba(95,216,224,.06);border-radius:0 8px 8px 0}
.md code{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:.88em;padding:2px 6px;border-radius:4px;background:#111215;color:#e6e3dc}
.md pre{margin:14px 0;padding:14px 16px;background:#111215;border:1px solid #26282e;border-radius:8px;white-space:pre-wrap;font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:13.5px;line-height:1.6;color:#d8d5ce}
.md .tr{display:inline-block;font-family:'Golos Text',sans-serif;font-weight:700;font-size:.82em;line-height:1;padding:4px 7px 3px;border-radius:5px;color:rgb(var(--c));background:rgba(var(--c),.12);box-shadow:inset 0 0 0 1px rgba(var(--c),.3);vertical-align:.08em}
.md h3 .tr{font-size:15px;padding:6px 10px 5px}
.md .ft{display:inline-block;font-family:'Pixelify Sans',system-ui,sans-serif;font-size:.92em;line-height:1;padding:3px 7px;border-radius:5px;background:var(--slate-2);color:var(--ink);vertical-align:.05em}
.md .it{width:22px;height:22px;vertical-align:-5px;image-rendering:pixelated}

/* кит: окно инвентаря как в игре */
.kitwrap{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin:20px 0 6px}
.mcgui{--s:clamp(30px,8.6vw,40px);background:#c6c6c6;padding:10px;border-radius:3px;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555,0 0 0 2px #000;width:max-content;max-width:100%}
.mcgui h4{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:500;font-size:15px;color:#3f3f3f;margin:0 0 6px 2px}
.mcgrid{display:grid;grid-template-columns:repeat(9,var(--s))}
.mcgrid+.mcgrid{margin-top:calc(var(--s) * .22)}
.mctop{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end}
.mctop .col{display:grid}
.mctop .meta{font-family:'Pixelify Sans',system-ui,sans-serif;font-size:13px;color:#3f3f3f;line-height:1.35;padding:0 0 4px 6px}
.mcpl{width:calc(var(--s) * 2.3);height:calc(var(--s) * 4);background:#000;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #fff;display:grid;place-items:center;overflow:hidden}
.mcpl img{height:88%;width:auto;max-width:92%;object-fit:contain}
.mctop .meta{align-self:flex-start;padding-top:4px}
.mcgui .slot{position:relative;width:var(--s);height:var(--s);padding:0;gap:0;border-radius:0;transition:none;background:#8b8b8b;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #fff;display:grid;place-items:center;cursor:default}
.mcgui .slot img{image-rendering:pixelated}
.mcgui .slot:hover{background:#a3a3a3}
.mcgui .slot .n{position:absolute;right:2px;bottom:0;font-family:'Pixelify Sans',system-ui,sans-serif;font-size:calc(var(--s) * .4);line-height:1;color:#fff;text-shadow:2px 2px 0 #3f3f3f;pointer-events:none}
.ench{position:relative}
.ench:after{content:'';position:absolute;inset:10%;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:linear-gradient(115deg,transparent 30%,rgba(190,120,255,.55) 45%,transparent 60%) 0 0/300% 100%;animation:glint 3.2s linear infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes glint{from{background-position:120% 0}to{background-position:-120% 0}}
.mctip{position:fixed;z-index:60;pointer-events:none;padding:6px 9px;background:rgba(16,0,16,.95);box-shadow:0 0 0 2px #2a0a5e,inset 0 0 0 2px #2a0a5e;border:2px solid rgba(16,0,16,.95);font-family:'Pixelify Sans',system-ui,sans-serif;font-size:15px;line-height:1.35;color:#fff;text-shadow:2px 2px 0 #3e3e3e;white-space:nowrap}
.mctip .e{color:#aaa}
.mctip.ench-name b{color:#55ffff;font-weight:500}
.mctip b{font-weight:500}
.kitlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin:12px 0}
.kitlist div{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--slate);border-radius:7px;font-size:14px}
.kitlist img{width:24px;height:24px;image-rendering:pixelated}
.kitlist b{margin-left:auto;font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:500;color:var(--dim);font-size:15px}
.kitlist small{display:block;color:var(--faint);font-size:12.5px;line-height:1.3}
@media(max-width:560px){.md h2{font-size:22px}.rtabs{width:100%}.rtabs a{flex:1;justify-content:center;padding:8px 6px;font-size:13px}.rtabs a img{display:none}.kitwrap{gap:14px}}
@media(prefers-reduced-motion:reduce){.ench:after{animation:none}}
/* --- Турниры --- */
.tchip{display:inline-block;font-family:'Golos Text',sans-serif;font-weight:700;font-size:11px;line-height:1;padding:3px 5px 2px;border-radius:4px;color:rgb(var(--c));background:rgba(var(--c),.12);box-shadow:inset 0 0 0 1px rgba(var(--c),.28)}
.hd{width:22px;height:22px;image-rendering:pixelated;border-radius:3px;flex-shrink:0;background:var(--slate-2)}
.tm-sub{color:var(--dim);font-size:14px;margin-top:6px}
.tm-st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--slate-2);color:var(--dim)}
.tm-st:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.tm-st.reg{color:var(--dia)}
.tm-st.live{color:var(--up)}
.tm-st.done{color:rgb(var(--t1-rgb))}
.tm-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:20px}
.tm-card{display:block;padding:18px;background:var(--slate);border-radius:12px;color:inherit;text-decoration:none;transition:background .15s;box-shadow:inset 0 0 0 1px transparent}
.tm-card:hover{background:var(--slate-2)}
.tm-card h3{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;font-size:21px;line-height:1.2;margin:12px 0 4px;word-break:break-word}
.tm-card .who{color:var(--faint);font-size:13px}
.tm-heads{display:flex;margin-top:14px;align-items:center}
.tm-heads img{width:26px;height:26px;margin-right:-6px;border:2px solid var(--slate);border-radius:5px;image-rendering:pixelated;background:var(--slate-2)}
.tm-card:hover .tm-heads img{border-color:var(--slate-2)}
.tm-heads span{margin-left:14px;color:var(--dim);font-size:13px}
.tm-win{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}
.tm-win b{color:rgb(var(--t1-rgb));font-weight:600}
.tm-form{background:var(--slate);border-radius:12px;padding:18px;margin-top:20px;max-width:640px}
.tm-form h4{font-size:15px;font-weight:600;margin-bottom:10px}
.tm-form .rowf{display:flex;gap:8px;flex-wrap:wrap}
.tm-form input{flex:1 1 180px;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--edge);background:var(--ground);color:var(--ink);font:inherit;font-size:14px}
.tm-form input:focus{outline:none;border-color:var(--dia)}
.tbtn{padding:10px 16px;border-radius:8px;border:0;background:var(--ink);color:var(--ground);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tbtn:hover{filter:brightness(.92)}
.tbtn:disabled{opacity:.5;cursor:default}
.tbtn.ghost{background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--edge)}
.tbtn.ghost:hover{color:var(--ink)}
.tbtn.danger{background:transparent;color:var(--down);box-shadow:inset 0 0 0 1px rgba(224,100,90,.35)}
.tm-msg{font-size:13.5px;margin-top:10px;min-height:18px;color:var(--dim)}
.tm-msg.err{color:var(--down)}
.tm-msg.ok{color:var(--up)}
.tm-back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;color:var(--dim);text-decoration:none;font-size:14px}
.tm-back:hover{color:var(--ink)}
.tm-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.tm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tm-head h1{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.1;margin-top:12px;word-break:break-word}
.tm-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tm-ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:14px}
.tm-p{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--slate);border-radius:8px;font-size:14.5px}
.tm-p .hd{width:28px;height:28px}
.tm-p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-p button{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
.tm-p button:hover{color:var(--down)}
.tm-empty{color:var(--faint);font-size:14px;margin-top:14px}

/* сетка */
.br-wrap{margin-top:22px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.br{display:flex;gap:28px;min-width:max-content;align-items:stretch}
.rd{display:flex;flex-direction:column;width:224px}
.rd h5{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:500;font-size:15px;color:var(--dim);text-align:center;margin-bottom:10px;height:20px}
.rd-b{display:flex;flex-direction:column;flex:1}
.mw{flex:1;display:flex;align-items:center;position:relative;padding:6px 0}
.rd:not(:last-child) .mw:after{content:'';position:absolute;right:-15px;width:14px;border:2px solid var(--edge);border-left:0}
.rd:not(:last-child) .mw:nth-child(odd):after{top:50%;bottom:0;border-bottom:0;border-radius:0 6px 0 0}
.rd:not(:last-child) .mw:nth-child(even):after{top:0;bottom:50%;border-top:0;border-radius:0 0 6px 0}
.rd:not(:first-child) .mw:before{content:'';position:absolute;left:-15px;top:50%;width:14px;border-top:2px solid var(--edge)}
.rd.champ .mw:before{left:-15px}
.m{width:100%;background:var(--slate);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--edge)}
.m.can{cursor:pointer}
.m.can:hover{box-shadow:inset 0 0 0 1px var(--dia)}
.m .s{display:flex;align-items:center;gap:8px;height:38px;padding:0 0 0 9px;font-size:14px;color:var(--dim)}
.m .s+.s{border-top:1px solid var(--edge)}
.m .s .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .s .sc{width:34px;align-self:stretch;display:grid;place-items:center;font-family:'Pixelify Sans',system-ui,sans-serif;font-size:17px;color:var(--faint);background:rgba(0,0,0,.14)}
.m .s.w{color:var(--ink)}
.m .s.w .sc{color:var(--ink);background:rgba(108,192,112,.16)}
.m .s.l{opacity:.55}
.m .s.tbd .n{color:var(--faint);font-style:italic}
.m .s.tbd .hd{opacity:.25}
.m .bye{font-size:11.5px;color:var(--faint);margin-right:8px}
.m .edit{display:none}
.champ .m{background:linear-gradient(180deg,rgba(var(--t1-rgb),.10),rgba(var(--t1-rgb),.02));box-shadow:inset 0 0 0 1px rgba(var(--t1-rgb),.35);text-align:center;padding:14px 10px 12px}
.champ .m img{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 6px}
.champ .m small{display:block;font-size:12px;color:rgb(var(--t1-rgb));letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.champ .m b{display:block;font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;font-size:20px;color:var(--ink);margin-top:2px;word-break:break-all}
.champ .m.wait b{color:var(--faint);font-size:16px}
.tm-hint{font-size:13px;color:var(--faint);margin-top:8px}

/* окно счёта */
.tm-ov{position:fixed;inset:0;z-index:80;background:rgba(8,8,12,.72);display:grid;place-items:center;padding:16px}
.tm-dlg{width:100%;max-width:420px;background:var(--slate);border-radius:14px;padding:20px;box-shadow:0 0 0 1px var(--edge),0 24px 60px rgba(0,0,0,.5)}
.tm-dlg h4{font-family:'Pixelify Sans',system-ui,sans-serif;font-weight:600;font-size:20px}
.tm-dlg p{color:var(--dim);font-size:13.5px;margin:4px 0 14px}
.tm-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tm-pick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 10px;border-radius:10px;border:0;background:var(--ground);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--edge);min-width:0}
.tm-pick button img{width:56px;height:56px;image-rendering:pixelated}
.tm-pick button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-pick button.on{box-shadow:inset 0 0 0 2px var(--up);background:rgba(108,192,112,.08)}
.tm-pick button.on:after{content:'Победил';font-size:11.5px;font-weight:600;color:var(--up)}
.tm-sc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px}
.tm-sc input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--edge);background:var(--ground);color:var(--ink);font-family:'Pixelify Sans',system-ui,sans-serif;font-size:22px;text-align:center}
.tm-sc input::-webkit-outer-spin-button,.tm-sc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tm-sc input{-moz-appearance:textfield;appearance:textfield}
.tm-sc input:focus{outline:none;border-color:var(--dia)}
.tm-sc i{font-style:normal;color:var(--faint);font-size:20px}
.tm-dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:560px){.rd{width:196px}.br{gap:24px}.tm-list{grid-template-columns:1fr}}
.rd.final .mw:after{top:50% !important;bottom:auto !important;height:0;border-right:0 !important;border-bottom:0 !important;border-radius:0 !important}

/* === Оформление v2: интерфейс как меню Minecraft - жёсткие края, фаски, пиксельный шрифт === */
:root{
  --ground:#141416;--slate:#222327;--slate-2:#2e3036;--edge:#3a3c44;
  --hi:#474a53;--lo:#0b0b0d;--out:#060607;
  --px:'Pixelify Sans',system-ui,sans-serif;
  --bev:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo);
}
*,*::before,*::after{border-radius:0 !important;transition:none !important}
.side{background:#0f0f11;border-right:2px solid var(--out);box-shadow:inset -2px 0 0 #232429}
.side-foot{border-top:2px solid var(--out);box-shadow:inset 0 2px 0 #232429}
.grp{font-family:var(--px);font-size:13.5px}
.item{font-family:var(--px);font-size:16px;font-weight:500;padding:8px 10px;margin-bottom:2px}
.item:hover{background:var(--slate);outline:2px solid var(--ink);outline-offset:-2px}
.item.on{background:var(--slate-2);box-shadow:var(--bev)}
.item.ds:hover{outline-color:#a7aef5}
.login{font-family:var(--px);font-size:14.5px;white-space:nowrap;gap:7px;padding:10px 8px;font-weight:500;text-shadow:2px 2px 0 rgba(0,0,0,.35);box-shadow:inset 2px 2px 0 #7480e8,inset -2px -3px 0 #333c96,0 0 0 2px var(--out)}
.login:hover{box-shadow:inset 2px 2px 0 #8f99f5,inset -2px -3px 0 #3d47ad,0 0 0 2px #fff}
.menu-pop,.sug{border:0;box-shadow:var(--bev),0 0 0 2px var(--out),0 16px 30px rgba(0,0,0,.5)}

.search input{background:#09090b;border:2px solid #4a4d56;padding:9px 36px 9px 12px}
.search input:focus{background:#09090b;border-color:var(--ink)}

.ph{font-size:clamp(28px,3.6vw,40px);text-shadow:3px 3px 0 rgba(0,0,0,.55)}
.sh{font-family:var(--px);font-weight:500;font-size:20px}
.regs button,.tbtn{font-family:var(--px);font-size:15px;font-weight:500;color:#fff;background:#484b54;text-shadow:2px 2px 0 rgba(0,0,0,.4);box-shadow:inset 2px 2px 0 #6c707b,inset -2px -3px 0 #2a2c32,0 0 0 2px var(--out)}
.regs{gap:10px}
.regs button:hover,.tbtn:hover{filter:none;color:#fff;background:#535762;box-shadow:inset 2px 2px 0 #7b808c,inset -2px -3px 0 #30333a,0 0 0 2px #fff}
.regs button.on{background:var(--ink);color:#141416;text-shadow:none;box-shadow:inset 2px 2px 0 #fff,inset -2px -3px 0 #a9a69f,0 0 0 2px var(--out)}
.tbtn.ghost{background:#2e3036;color:var(--dim);box-shadow:inset 2px 2px 0 #474a53,inset -2px -3px 0 #1a1b1f,0 0 0 2px var(--out)}
.tbtn.danger{background:#3a2526;color:#ff9a90;box-shadow:inset 2px 2px 0 #5c3a3b,inset -2px -3px 0 #221516,0 0 0 2px var(--out)}
.tbtn:disabled{box-shadow:inset 2px 2px 0 #474a53,inset -2px -3px 0 #1a1b1f,0 0 0 2px var(--out);background:#2e3036;color:var(--faint);text-shadow:none}

.badge,.tchip,.md .tr{font-family:var(--px);font-weight:500;letter-spacing:0;background:rgba(var(--c),.14);box-shadow:inset 0 0 0 1px rgba(var(--c),.42),inset 0 -3px 0 rgba(var(--c),.22)}
.badge{font-size:14px;padding:5px 7px 6px}
.slot .badge,.sug a .badge,.kc .badge{font-size:13px;padding:4px 6px 5px}
.tchip{font-size:12.5px;padding:3px 5px 4px}

/* тир-лист: колонка как сундук, шапка залита цветом тира */
.cols{gap:14px}
.col{background:var(--slate);box-shadow:var(--bev),0 0 0 2px var(--out)}
.col-hd{background:rgb(var(--c));color:#17181b;border-bottom:0;padding:11px 14px 12px;font-family:var(--px);font-weight:600;font-size:18px;box-shadow:inset 2px 2px 0 rgba(255,255,255,.34),inset -2px -3px 0 rgba(0,0,0,.3)}
.col-hd .dot{display:none}
.col-hd i{font-family:var(--px);font-size:15px;color:rgba(0,0,0,.62)}
.col-body{padding-top:8px}
.slot:hover{background:var(--slate-2);outline:2px solid var(--ink);outline-offset:-2px}
.mcgui .slot:hover{outline:0}

.row,.fi,.tm-p,.kitlist div,.md ol li,.fact{box-shadow:var(--bev)}
.row:hover,.fi:hover{outline:2px solid var(--ink);outline-offset:-2px}
.row.t1{box-shadow:inset 5px 0 0 rgb(var(--t1-rgb)),var(--bev)}
.row.t2{box-shadow:inset 5px 0 0 rgb(var(--t2-rgb)),var(--bev)}
.row.t3{box-shadow:inset 5px 0 0 rgb(var(--t3-rgb)),var(--bev)}
.row .pos{font-family:var(--px);font-size:18px;font-weight:500}
.pt b,.fact b{font-family:var(--px);font-weight:600;font-size:20px}
.lb,.feed,.hist{gap:6px}
.nores,.tm-form,.tm-card,.tm-dlg,.rtabs{box-shadow:var(--bev),0 0 0 2px var(--out)}
.profile{box-shadow:0 0 0 2px var(--out)}
.tm-card:hover{outline:2px solid var(--ink);outline-offset:0}
.tm-st{font-family:var(--px);font-size:13.5px;font-weight:500;padding:3px 8px 4px}
.rtabs{padding:6px;gap:6px}
.rtabs a{font-family:var(--px);font-size:15.5px}
.rtabs a.on{box-shadow:var(--bev)}
.m{box-shadow:var(--bev)}
.m.can:hover{box-shadow:var(--bev);outline:2px solid var(--ink);outline-offset:-2px}
.champ .m{background:rgba(var(--t1-rgb),.07);box-shadow:inset 2px 2px 0 rgba(var(--t1-rgb),.5),inset -2px -2px 0 rgba(var(--t1-rgb),.2)}
.tm-form input,.tm-sc input{background:#09090b;border:2px solid #4a4d56}
.tm-form input:focus,.tm-sc input:focus{border-color:var(--ink)}
.tm-pick button{box-shadow:inset 2px 2px 0 #0b0b0d,inset -2px -2px 0 #33353c}
.tm-pick button.on{box-shadow:inset 0 0 0 3px var(--up)}
.md h3{border-bottom:2px solid var(--edge)}
.md blockquote{border-left-width:4px}
@media(max-width:560px){.rtabs a{font-size:13.5px;white-space:nowrap;padding:8px 4px}.rtabs{gap:2px;padding:4px}.cols{gap:12px}}
</style>

<script>

const API = ''; // пусто = тот же домен
// на зеркале GitHub Pages сервера нет — данные лежат рядом файлом, его выкладывает бот
const MIRROR = /\.github\.io$/.test(location.hostname);
const DISCORD = 'https://discord.gg/cWnFv6Gm8J';

// режимы тир-листа: у каждого свой список игроков от бота, очки складываются в Overall
const KITS = [
  {key:'diacart',  name:'DiaCart',  route:'tierlist', file:'players.json',  api:'/api/site/players'},
];
const kitUrl = k => MIRROR ? k.file + '?t=' + Date.now() : API + k.api;
// R-тиры (бывшие игроки) дают столько же очков, сколько обычные
const TIER_PTS = {HT1:60,RHT1:60,LT1:45,RLT1:45,HT2:30,RHT2:30,LT2:20,RLT2:20,HT3:10,RHT3:10,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1};
const TIER_ORDER = ['HT1','RHT1','LT1','RLT1','HT2','RHT2','LT2','RLT2','HT3','RHT3','LT3','HT4','LT4','HT5','LT5'];
const ALL_TIERS = ['HT1','LT1','HT2','LT2','HT3','LT3','HT4','LT4','HT5','LT5','RHT1','RLT1','RHT2','RLT2','RHT3'];
const tierNum = t => String(t).slice(-1);

const MOCK = {
  diacart: [
    {name:'MorozBS', region:'RU', tier:'HT1', history:[{tier:'HT1', date:'2026-08-17'}, {tier:'LT1', date:'2026-06-28'}]},
    {name:'Ter44', region:'RU', tier:'HT1', history:[{tier:'HT1', date:'2026-08-09'}]},
    {name:'Melisyn', region:'RU', tier:'LT1', history:[{tier:'LT1', date:'2026-08-18'}, {tier:'HT2', date:'2026-07-05'}]},
    {name:'Alinka_V_Solo', region:'EU', tier:'HT2', history:[{tier:'HT2', date:'2026-08-12'}]},
    {name:'iwtgod', region:'EU', tier:'LT2', history:[{tier:'LT2', date:'2026-08-15'}, {tier:'HT3', date:'2026-07-19'}]},
  ],
};

const STEVE = 'MHF_Steve';
// на основном сайте скины раздаёт бот (кэш), на зеркале и без сервера — напрямую от Visage
const SKIN_PROXY = false; // скины напрямую с Visage — сайт не зависит от версии api.js
const bust = n => SKIN_PROXY ? `/skin/bust/${encodeURIComponent(n)}` : `https://visage.surgeplay.com/bust/160/${encodeURIComponent(n)}`;
const full = n => SKIN_PROXY ? `/skin/full/${encodeURIComponent(n)}` : `https://visage.surgeplay.com/full/512/${encodeURIComponent(n)}`;
// Visage отбивает часть запросов, когда скинов на странице много:
// сначала повторяем с паузой, потом показываем Стива
const visage = (n, isFull) => isFull
  ? `https://visage.surgeplay.com/full/512/${encodeURIComponent(n)}`
  : `https://visage.surgeplay.com/bust/160/${encodeURIComponent(n)}`;

function skinChain(img){
  const n = img.dataset.name, isFull = img.dataset.skin === 'full';
  const direct = visage(n, isFull);
  return [
    // бот не отдал скин — сразу берём его напрямую у Visage, а не Стива
    ...(SKIN_PROXY ? [{src: direct, wait: 0}] : []),
    // у ников без лицензии скина нет вообще — повторять долго бессмысленно, один повтор и Стив
    {src: direct + '?r=1', wait: 1000},
    {src: visage(STEVE, isFull), wait: 0},
    {src: `https://mc-heads.net/${isFull ? 'body' : 'head'}/${STEVE}/${isFull ? 256 : 128}`, wait: 0},
  ];
}

const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

function nextSkin(img){
  if(!img.isConnected) return;
  const chain = skinChain(img);
  const i = +(img.dataset.fb || 0);
  if(i >= chain.length){ img.style.visibility = 'hidden'; img.dataset.ok = '1'; return; }
  img.dataset.fb = i + 1;
  img.src = BLANK;

  setTimeout(() => {
    if(!img.isConnected || img.dataset.ok) return;
    img.src = chain[i].src;
    // запрос завис без ответа — не ждём вечно
    const armed = img.src;
    setTimeout(() => {
      if(img.isConnected && !img.dataset.ok && img.src === armed) nextSkin(img);
    }, 9000);
  }, chain[i].wait);
}

addEventListener('error', e => {
  const img = e.target;
  if(img.tagName === 'IMG' && img.dataset.skin) nextSkin(img);
}, true);

// первый запрос тоже может повиснуть — засекаем время, когда скин появился на экране
// (раньше нельзя: из-за loading="lazy" картинки ниже экрана ещё и не начинали грузиться)
const skinWatch = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
  for(const e of entries){
    if(!e.isIntersecting) continue;
    const img = e.target;
    skinWatch.unobserve(img);
    const src = img.src;
    setTimeout(() => {
      if(img.isConnected && !img.dataset.ok && !img.dataset.fb && img.src === src) nextSkin(img);
    }, 12000);
  }
}) : null;

function watchSkins(){
  if(skinWatch) document.querySelectorAll('img[data-skin]:not([data-ok])').forEach(i => skinWatch.observe(i));
}
const skinImg = (n, kind) =>
  `<img src="${kind==='full'?full(n):bust(n)}" data-skin="${kind||'bust'}" data-name="${esc(n)}" alt="" loading="lazy">`;

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kitOf = key => KITS.find(k => k.key === key);
const pts = p => KITS.reduce((sum, k) => sum + (p.kits[k.key] ? TIER_PTS[p.kits[k.key].tier] || 0 : 0), 0);
// лучший тир игрока среди всех режимов — для цвета профиля
const best = p => KITS.map(k => p.kits[k.key] && p.kits[k.key].tier).filter(Boolean)
  .sort((a, b) => TIER_ORDER.indexOf(a) - TIER_ORDER.indexOf(b))[0];

const badge = t => `<span class="badge g${tierNum(t)}">${t}</span>`;

const nores = html => `<div class="nores">${html}</div>`;
const regText = r => r && r !== '—' ? esc(r) : '';

function blockTex(base, hi, lo, seed){
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const x = c.getContext('2d');
  let s = seed >>> 0;
  const rnd = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  for(let i = 0; i < 16; i++) for(let j = 0; j < 16; j++){
    x.fillStyle = base[Math.floor(rnd() * base.length)];
    x.fillRect(i, j, 1, 1);
  }
  if(hi){
    x.fillStyle = hi; x.fillRect(0, 0, 16, 1); x.fillRect(0, 0, 1, 16);
    x.fillStyle = lo; x.fillRect(0, 15, 16, 1); x.fillRect(15, 0, 1, 16);
  }
  return `url("${c.toDataURL()}")`;
}

function paintTextures(){
  try{
    const r = document.documentElement.style;
    r.setProperty('--tex-gold',   blockTex(['#f7d84a','#fbe46a','#f2c632','#f5d040','#eec22c'], '#fff4a3', '#b8860b', 7));
    r.setProperty('--tex-iron',   blockTex(['#dedede','#e8e8e8','#d2d2d2','#cacaca','#d9d9d9'], '#f7f7f7', '#8f8f8f', 11));
    r.setProperty('--tex-copper', blockTex(['#c86f3d','#d47d48','#b96034','#c4693a','#cf7642'], '#eba374', '#7a3b1d', 13));
    r.setProperty('--tex-ground', blockTex(['#18191d','#1a1b1f','#16171b','#1b1c21','#191a1e'], null, null, 3));
  }catch(e){}
}

function ago(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if(d <= 0) return 'сегодня';
  if(d === 1) return 'вчера';
  if(d < 7) return `${d} дн. назад`;
  if(d < 31) return `${Math.floor(d / 7)} нед. назад`;
  return new Date(iso).toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
}

function regionBar(){
  const list = [...new Set(players.map(p => p.region))].filter(r => r && r !== '—').sort();
  if(list.length < 2) return '';
  const btn = (v, label) =>
    `<button type="button" data-reg="${v}" class="${region === v ? 'on' : ''}">${label}</button>`;
  return `<div class="regs">${btn('ALL', 'Все')}${list.map(r => btn(r, r)).join('')}</div>`;
}

function renderMenu(on){
  const li = (href, label, ico, cls) =>
    `<a href="${href}" class="item ${cls || ''} ${on === href ? 'on' : ''}"${cls === 'ds' ? ' target="_blank" rel="noopener"' : ''}>${ico}${label}</a>`;

  menu.innerHTML =
    `<div class="grp">Режимы</div>` +
    li('#/', 'Overall', IC.overall) +
    KITS.map(k => li('#/' + k.route, k.name, kitIco(k))).join('') +
    `<div class="grp">Ещё</div>` +
    li('#/tournaments', 'Турниры', IC.cup) +
    li('#/rules', 'Правила', IC.rules) +
    li('#/results', 'Results', IC.results) +

    li(DISCORD, 'Discord', IC.ds, 'ds') +

    (on === '#/admin' ? li('#/admin', 'Панель', IC.admin) : '');

      ${skinImg(c.p.name)}
      <span class="nm">${esc(c.p.name)}</span>

      <span class="mv">
        ${c.from ? `<span class="old">${badge(c.from)}</span>` : ''}

        ${badge(c.to)}
      </span>

    </a>`).join('');
}

function podium(all){
  const MAT = {1:'gold', 2:'iron', 3:'copper'};
  const H = {1:3, 2:2, 3:1};
  const STEP = 95;

  let t = 0;
  const rowDelay = {};
  for(const r of [3, 2, 1]){
    rowDelay[r] = [];
    for(let k = 0; k < H[r]; k++){ rowDelay[r].push(t); t += STEP; }
  }
  const playerDelay = {3: t + 40, 2: t + 150, 1: t + 260};

  const step = r => {
    const p = all[r - 1];
    const rows = Array.from({length: H[r]}, (_, k) => {
      const d = rowDelay[r][H[r] - 1 - k];
      return `<div class="blk" style="--d:${d}ms">${k === 0 ? `<span class="rk">${r}</span>` : ''}</div>`;
    }).join('');

    const who = p ? `
      <a href="#/player/${encodeURIComponent(p.name)}" class="who" style="--d:${playerDelay[r]}ms">
        <span class="nametag"><b>${esc(p.name)}</b><span class="pp">${pts(p)}</span></span>
        ${skinImg(p.name)}
      </a>` : '';

    return `<div class="step ${MAT[r]}">${who}<div class="blocks">${rows}</div></div>`;
  };

  return `<div class="stage">${step(2)}${step(1)}${step(3)}</div>`;
}

function leaderboard(){
  const s = query();
  const all = ranked();
  const found = all.map((p, i) => ({p, rank: i + 1})).filter(x => nameMatch(x.p, s));

  const head = `<h1 class="ph">Overall</h1>` + regionBar();
  if(!all.length) return head + nores(region === 'ALL'
    ? 'В тир-листе пока никого нет. Игроки появятся после первых тестов.'
    : 'В этом регионе пока никого нет.');
  if(s && !found.length) return head + nores(`Никого не нашлось по запросу «${esc(s)}».`);

  const rows = found.slice(0, 100).map(({p, rank}) => `
    <a href="#/player/${encodeURIComponent(p.name)}" class="row${rank <= 3 ? ' t' + rank : ''}">
      <span class="pos">${rank}</span>
      <span class="who">${skinImg(p.name)}<b>${esc(p.name)}</b>${retTag(p)}</span>
      <span class="reg">${regText(p.region)}</span>
      ${kitCells(p)}
      ${ptsCell(p)}
    </a>`).join('');

  return head
    + (s ? `<h2 class="sh">Найдено: ${found.length}</h2>` : podium(all))
    + `<div class="lb">${rows}</div>`;
}

function tierList(kit){
  const s = query();
  const pool = visible().filter(p => p.kits[kit.key]).map(p => Object.assign({}, p, {tier: p.kits[kit.key].tier}));

  const cols = [1, 2, 3, 4, 5].map(n => {
    // в колонке сначала HT, потом R-HT, затем LT и R-LT
    const ht = [...pool.filter(p => p.tier === 'HT' + n), ...pool.filter(p => p.tier === 'RHT' + n)];
    const lt = [...pool.filter(p => p.tier === 'LT' + n), ...pool.filter(p => p.tier === 'RLT' + n)];
    const list = [...ht, ...lt];

    const body = list.length
      ? list.map((p, i) => `
          <a href="#/player/${encodeURIComponent(p.name)}" class="slot${i === ht.length && ht.length ? ' split' : ''}">
            ${skinImg(p.name)}<span>${esc(p.name)}</span>${badge(p.tier)}
          </a>`).join('')
      : `<div class="empty">${s ? 'Нет совпадений' : 'Пока никого'}</div>`;

    return `<div class="col g${n}">
      <div class="col-hd"><span class="dot"></span>Tier ${n}<i>${list.length}</i></div>
      <div class="col-body">${body}</div>
    </div>`;
  }).join('');

  return `<h1 class="ph">${kitIco(kit)}${kit.name}</h1>`
    + regionBar()
    + `<div class="cols">${cols}</div>`;
}

function results(){
  const s = query();
  const log = changeLog().filter(c => nameMatch(c.p, s));
  const head = `<h1 class="ph">Results</h1>` + regionBar();

  if(!log.length){
    return head + nores(s
      ? `Нет изменений по запросу «${esc(s)}».`
      : 'Изменений пока нет. Они появятся здесь после первого тир-теста.');
  }
  const more = log.length > 100
    ? `<p class="more">Показаны последние 100 из ${log.length}. Найди игрока через поиск, чтобы увидеть остальные.</p>`
    : '';
  return head + `<div class="feed">${feedRows(log.slice(0, 100))}</div>` + more;
}

function playerPage(name){
  const p = players.find(x => x.name.toLowerCase() === name.toLowerCase());
  if(!p) return notFound(`Игрока «${esc(name)}» нет в тир-листе.`);

  const rank = sortByPts(players.slice()).findIndex(x => x.name === p.name) + 1;
  const top = best(p) || 'LT5';
  const th = THEMES[p.theme] || null;

  // плитки режимов: значок в кружке цвета тира, тир и очки
  const kitTiles = KITS.map(k => {
    const own = p.kits[k.key];
    return own
      ? `<div class="ktile g${tierNum(own.tier)}"><span class="orb">${kitIco(k)}</span><span><b>${k.name}</b><span class="tv">${own.tier}</span> <em>· ${TIER_PTS[own.tier] || 0} очк.</em></span></div>`
      : `<div class="ktile none"><span class="orb">${kitIco(k)}</span><span><b>${k.name}</b><em>нет тира</em></span></div>`;
  }).join('');

  const sections = KITS.filter(k => p.kits[k.key]).map(k => {
    const own = p.kits[k.key];
    const h = own.history && own.history.length ? own.history : [{tier: own.tier, date: null}];
    const rows = h.map((e, i) => {
      const prev = h[i + 1];
      const txt = !prev ? 'Первый тир'
        : idx(e.tier) < idx(prev.tier) ? `Повышение с ${prev.tier}`
        : `Понижение с ${prev.tier}`;
      return `<div class="hi${i === 0 ? ' now' : ''}">
        <span class="dot"></span>${badge(e.tier)}
        <span class="txt">${txt}</span>
        <span class="dt">${e.date ? fmt(e.date) : ''}</span>
      </div>`;
    }).join('');
    return `<h2 class="sh ksec">История тира — ${k.name}</h2><div class="hist">${rows}</div>`;
  }).join('');

  return `
  <a href="#/" class="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Назад</a>
  <div class="profile g${tierNum(top)}${th ? ' hasbg th-' + th.fx : ''}"${th ? ` style="--pbg:url('${th.bg}')"` : ''}>
    ${th ? `<span class="pfog" aria-hidden="true"></span><canvas class="pfx" data-fx="${th.fx}" aria-hidden="true"></canvas><span class="pglow" aria-hidden="true"></span>` : ''}
    ${skinImg(p.name, 'full')}
    <div>
      <h1>${esc(p.name)}</h1>
      <div class="facts">
        <div class="fact"><small>Место</small><b>#${rank}</b></div>
        <div class="fact"><small>Очки</small><b>${pts(p)}</b></div>
        ${regText(p.region) ? `<div class="fact"><small>Регион</small><b>${regText(p.region)}</b></div>` : ''}
        ${p.retired ? '<div class="fact"><small>Статус</small><b style="color:var(--dim)">Retired</b></div>' : ''}
      </div>
      <div class="ktiers">${kitTiles}</div>
    </div>
  </div>
  ${sections}`;
}

function changeLog(){
  const out = [];
  for(const p of players.filter(inRegion)){
    for(const kit of KITS){
      const own = p.kits[kit.key];
      if(!own) continue;
      const h = own.history || [];
      h.forEach((e, i) => {
        const prev = h[i+1];
        out.push({
          p, kit, date: e.date, to: e.tier, from: prev ? prev.tier : null,
          dir: !prev ? 'new' : (idx(e.tier) < idx(prev.tier) ? 'up' : 'down')
        });
      });
    }
  }
  return out.sort((a,b)=> new Date(b.date) - new Date(a.date));
}

const sug = document.getElementById('sug');
let sugList = [], sugAt = -1;
function sugDraw(){
  const s = query().toLowerCase();
  if(!s || !players.length || document.activeElement !== q){ sug.hidden = true; sugList = []; sugAt = -1; return; }
  const hit = players.filter(p => p.name.toLowerCase().includes(s));
  sugList = sortByPts(hit.filter(p => p.name.toLowerCase().startsWith(s))).concat(sortByPts(hit.filter(p => !p.name.toLowerCase().startsWith(s)))).slice(0, 7);
  if(sugAt >= sugList.length) sugAt = -1;
  sug.innerHTML = sugList.length ? sugList.map((p, i) => {
    const tier = best(p), at = p.name.toLowerCase().indexOf(s);
    const nm = esc(p.name.slice(0, at)) + '<b>' + esc(p.name.slice(at, at + s.length)) + '</b>' + esc(p.name.slice(at + s.length));
    return `<a href="#/player/${encodeURIComponent(p.name)}" data-i="${i}" class="${i === sugAt ? 'at' : ''}">${skinImg(p.name)}<span>${nm}</span>${tier ? `<span class="badge g${tierNum(tier)}">${tier}</span>` : ''}</a>`;
  }).join('') : '<div class="sug-no">Никого не нашли</div>';
  sug.hidden = false;
  watchSkins();
}
function sugGo(p){ q.value = ''; qclr.hidden = true; sug.hidden = true; sugAt = -1; q.blur(); location.hash = '#/player/' + encodeURIComponent(p.name); router(); }
q.addEventListener('input', sugDraw);
q.addEventListener('focus', sugDraw);
q.addEventListener('blur', () => setTimeout(() => { sug.hidden = true; }, 150));
q.addEventListener('keydown', e => {
  if(sug.hidden || !sugList.length) return;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    sugAt = (sugAt + (e.key === 'ArrowDown' ? 1 : -1) + sugList.length + 1) % (sugList.length + 1);
    if(sugAt === sugList.length) sugAt = -1;
    sug.querySelectorAll('a').forEach((a, i) => a.classList.toggle('at', i === sugAt));
  }
  if(e.key === 'Enter'){ e.preventDefault(); sugGo(sugList[sugAt < 0 ? 0 : sugAt]); }
});
sug.addEventListener('mousedown', e => { const a = e.target.closest('a'); if(a){ e.preventDefault(); sugGo(sugList[+a.dataset.i]); } });

function wireMePage(){
  const btn = document.getElementById('bindBtn');
  if(!btn) return;
  btn.addEventListener('click', async () => {
    const nick = document.getElementById('mcNick').value.trim();
    const msg  = document.getElementById('bindMsg');
    if(!/^[A-Za-z0-9_]{3,16}$/.test(nick)){
      msg.className = 'msg err';
      msg.textContent = 'Ник — от 3 до 16 символов: латиница, цифры и _';
      return;
    }
    try{
      const r = await fetch(API + '/api/link', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mc: nick})
      });
      const data = await r.json();
      if(!r.ok) throw new Error(data.error || 'Не удалось сохранить');
      me.mc = data.mc;
      msg.className = 'msg ok';
      msg.textContent = 'Ник сохранён';
      renderAuth();
    }catch(e){
      msg.className = 'msg err';
      msg.textContent = e.message;
    }
  });
}

const TEAM_COLORS = ['#ff5d73', '#ffb547', '#5fa8ff', '#b48cff', '#4fd6a0', '#5fd8e0'];
let team = null, teamLoading = false;

async function loadTeam(){
  if(teamLoading || OFFLINE) return;
  teamLoading = true;
  try{
    // на зеркале команда лежит файлом рядом (его выкладывает бот)
    const r = await fetch(MIRROR ? 'team.json?t=' + Date.now() : API + '/api/site/team');
    if(r.ok){
      const data = await r.json();
      const changed = JSON.stringify(data) !== JSON.stringify(team);
      team = data;
      if(changed && location.hash.startsWith('#/team')) app.innerHTML = teamPage();
    }
  }catch(e){}
  teamLoading = false;
}

function teamPage(){
  const head = `<h1 class="ph">${IC.team}Команда проекта</h1>`;
  if(OFFLINE) return head + nores('Список команды доступен на основном сайте.');
  if(!team) return head + nores('Загрузка команды…');
  const servers = (team.servers || []).filter(sv => KITS.some(k => k.name === sv.name) && sv.groups.some(g => g.members.length));
  if(!servers.length) return head + nores('Список команды пока пуст.');

  return head + servers.map(sv => {
    const kit = KITS.find(k => k.name === sv.name);
    // у группы может быть свой цвет из src/servers.js, остальные красятся по порядку
    let n = 0;
    const groups = sv.groups.map(g => ({g, color: g.color || TEAM_COLORS[n++ % TEAM_COLORS.length]}))
      .filter(x => x.g.members.length)
      .map(({g, color}) => `
        <div class="tg" style="--tc:${color}">
          <div class="tg-hd"><span class="dot"></span>${esc(g.title)}<i>${g.members.length}</i></div>
          <div class="tg-list">${g.members.map(m => `
            <div class="tm">
              <img src="${esc(m.avatar)}" alt="" loading="lazy" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
              <div class="tm-t"><b>${esc(m.name)}</b><small>@${esc(m.username)}</small></div>
            </div>`).join('')}
          </div>
        </div>`).join('');
    return `<h2 class="sh ksec">${kit ? kitIco(kit) : ''}${esc(sv.name)}</h2><div class="team">${groups}</div>`;
  }).join('');
}

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} },
};
let admToken = store.get('adm');
let admEnabled = null;
let admSel = null;
let admQ = '';
let admMsg = null;

async function admApi(path, body){
  const r = await fetch(API + '/api/admin/' + path, {
    method: body ? 'POST' : 'GET',
    headers: Object.assign({'Content-Type': 'application/json'}, admToken ? {Authorization: 'Bearer ' + admToken} : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if(r.status === 401 && path !== 'login'){ admToken = null; store.set('adm', null); }
  if(!r.ok) throw new Error(data.error || 'Ошибка ' + r.status);
  return data;
}

function admListHtml(){
  const s = admQ.trim().toLowerCase();
  const list = sortByPts(players.filter(p => !s || p.name.toLowerCase().includes(s)).slice());
  const exact = s && players.some(p => p.name.toLowerCase() === s);
  const add = s && !exact && /^[a-z0-9_]{3,16}$/i.test(admQ.trim())

async function wireAdmin(){
  if(MIRROR || OFFLINE) return;
  if(!admToken && admEnabled === null){
    try{ admEnabled = (await admApi('status')).enabled; }catch(e){ admEnabled = true; }
    if(admEnabled === false && location.hash.startsWith('#/admin')) router();
  }

  const login = document.getElementById('admLogin');
  if(login){
    const pass = document.getElementById('admPass');
    const go = async () => {
      const m = document.getElementById('admLoginMsg');
      try{
        admToken = (await admApi('login', {password: pass.value})).token;
        store.set('adm', admToken);
        router();
      }catch(err){ m.className = 'msg err'; m.textContent = err.message; }
    };
    login.addEventListener('click', go);
    pass.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
    pass.focus();
    return;
  }

  const qi = document.getElementById('admQ');
  if(!qi) return;
  qi.addEventListener('input', () => {
    admQ = qi.value;
    document.getElementById('admList').innerHTML = admListHtml();
  });
  document.getElementById('admBackup').addEventListener('click', async e => {
    const b = e.currentTarget; b.disabled = true; b.textContent = 'Готовлю…';
    try{
      const r = await fetch(API + '/api/admin/backup', {headers: {Authorization: 'Bearer ' + admToken}});
      if(r.status === 401){ admToken = null; store.set('adm', null); router(); return; }
      if(!r.ok) throw new Error('Ошибка ' + r.status);
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'diacart-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      b.textContent = 'Скачано';
    }catch(err){ b.textContent = 'Не получилось: ' + err.message; }
    setTimeout(() => { b.disabled = false; b.textContent = 'Скачать копию базы'; }, 3000);
  });
  document.getElementById('admOut').addEventListener('click', async () => {
    try{ await admApi('logout', {}); }catch(e){}
    admToken = null; store.set('adm', null); admSel = null; router();
  });

  const root = document.querySelector('.adm');
  root.addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if(pick){ admSel = pick.dataset.pick; admMsg = null; admRefresh(); return; }

    if(e.target.id === 'admRename'){
      const nn = document.getElementById('admNick').value.trim();
      const old = admSel;
      admDo(async () => { await admApi('rename', {old, new: nn}); admSel = nn; }, `Ник изменён: ${old} → ${nn}`);
      return;
    }
    const th = e.target.closest('[data-theme]');
    if(th){
      const key = th.dataset.theme;
      admDo(() => admApi('theme', {nickname: admSel, theme: key}), key ? `${admSel}: выдан фон «${THEMES[key].name}»` : `${admSel}: фон снят`);
      return;
    }
    const save = e.target.closest('[data-save]');
    if(save){
      const kit = save.dataset.save;
      const tier = root.querySelector(`select[data-kit="${kit}"]`).value;
      const kn = kitOf(kit).name;
      if(!tier){
        admDo(() => admApi('delete', {kit, nickname: admSel}), `${admSel} убран из топа ${kn}`);
      }else{
        admDo(() => admApi('tier', {kit, nickname: admSel, tier}), `${kn}: ${admSel} теперь ${tier}`);
      }
      return;
    }
    const hist = e.target.closest('[data-hist]');
    if(hist){
      const kn = kitOf(hist.dataset.hist).name;
      if(!confirm(`Удалить всю историю тиров ${admSel} в ${kn}? Текущий тир останется.`)) return;
      admDo(async () => { const r = await admApi('history/clear', {kit: hist.dataset.hist, nickname: admSel}); admMsg = null; return r; },
        `${kn}: история тиров ${admSel} очищена`);
      return;
    }
    const del = e.target.closest('[data-del]');
    if(del){
      const kn = kitOf(del.dataset.del).name;
      if(!confirm(`Убрать ${admSel} из топа ${kn}?`)) return;
      admDo(() => admApi('delete', {kit: del.dataset.del, nickname: admSel}), `${admSel} убран из топа ${kn}`);
    }
  });
}

function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>')
       .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
       .replace(/\[\[([a-z_]+)\]\]/g, '<img class="it" src="items/$1.png" alt="">')
       .replace(/\bFT(\d+)\b/g, '<span class="ft">FT$1</span>')
       .replace(/\bBO(\d)\b/g, '<span class="ft">BO$1</span>')
       .replace(/\b([LH]T)([1-5])(\+?)/g, (m, a, n, p) => `<span class="tr g${n}">${a}${n}${p}</span>`);
  return s;
}
function md(src){
  const out = []; let list = null, step = 0, code = null;
  const close = () => { if(list){ out.push(`</${list}>`); list = null; } };
  for(const raw of src.split('\n')){
    const line = raw.trimEnd();
    if(line.startsWith('```')){
      if(code === null){ close(); code = []; } else { out.push(`<pre>${esc(code.join('\n'))}</pre>`); code = null; }
      continue;
    }
    if(code !== null){ code.push(line); continue; }
    let m;
    if(!line.trim()){ close(); continue; }
    if((m = line.match(/^## (.*)/))){ close(); out.push(`<h3>${mdInline(m[1]).replace(/-&gt;/g, '<span class="arr">→</span>')}</h3>`); step = 0; continue; }
    if((m = line.match(/^# (.*)/))){ close(); out.push(`<h2>${mdInline(m[1])}</h2>`); continue; }
    if((m = line.match(/^> (.*)/))){ close(); out.push(`<blockquote>${mdInline(m[1])}</blockquote>`); continue; }
    if((m = line.match(/^- (.*)/))){
      if(list !== 'ul'){ close(); out.push('<ul>'); list = 'ul'; }
      const ic = m[1].match(/^\[\[([a-z_]+)\]\]\s*(.*)/);
      out.push(ic ? `<li class="ico"><img class="it" src="items/${ic[1]}.png" alt=""><span>${mdInline(ic[2])}</span></li>` : `<li>${mdInline(m[1])}</li>`);
      continue;
    }
    if((m = line.match(/^\d+\. (.*)/))){
      if(list !== 'ol'){ close(); out.push('<ol>'); list = 'ol'; step = 0; }
      out.push(`<li><i>${++step}</i><span>${mdInline(m[1])}</span></li>`);
      continue;
    }
    close(); out.push(`<p>${mdInline(line)}</p>`);
  }
  close();
  return out.join('');
}

      : await fetchJson(API + '/api/site/tournaments', 7000).catch(() => fetchJson(MIRROR_DATA + 'tournaments.json?t=' + Date.now(), 12000));
    const changed = JSON.stringify(data) !== JSON.stringify(tms);
    tms = data;
    if(changed) tmRedraw();
  }catch(e){ if(tms === null){ tms = []; tmRedraw(); } }
  tmLoading = false;
}

function tmRedraw(){
  if(!location.hash.startsWith('#/tournaments') || tmDlg) return;
  const a = document.activeElement;
  if(a && a.tagName === 'INPUT' && a.closest('#app') && a.value) return;
  router();
}

async function tmApi(path, body, okText){
  try{
    const r = await admApi('tournament/' + path, body);
    tms = r.list;
    tmMsg = okText ? {ok: true, text: okText} : null;
    return r;
  }catch(err){
    tmMsg = {ok: false, text: err.message};
    return null;
  }finally{
    tmDlg = null;
    router();
  }
}

function tmView(t){
  const adm = tmAdmin();
  const msg = tmMsg ? `<div class="tm-msg ${tmMsg.ok ? 'ok' : 'err'}">${esc(tmMsg.text)}</div>` : '';
  const n = t.players.length;
  let html = `<div class="tm-head"><div>
      <span class="tm-st ${t.status}">${TM_ST[t.status]}</span>
      <h1>${esc(t.name)}</h1>
      <div class="tm-sub">Создал ${esc(t.creator)} · ${tmDate(t.createdAt)} · ${n} ${plural(n, 'участник', 'участника', 'участников')}</div>
    </div>
    ${adm ? `<div class="tm-tools">${t.status === 'reg' ? `<button type="button" class="tbtn" data-tm="start" ${n < 2 ? 'disabled' : ''}>Начать турнир</button>` : ''}<button type="button" class="tbtn danger" data-tm="delete">Удалить</button></div>` : ''}
  </div>`;

  if(t.status === 'reg'){
    if(adm){

      const opts = sortByPts(players.filter(p => p.kits.diacart && p.kits.diacart.tier && !taken.has(p.name.toLowerCase())).slice())
        .map(p => `<option value="${esc(p.name)}">${esc(p.kits.diacart.tier)}</option>`).join('');
      html += `<div class="tm-form">
        <h4>Добавить участника</h4>

      ? `<div class="tm-ppl">${t.players.map(p => `<div class="tm-p">${tmHead(p.name, 28)}<span class="nm">${esc(p.name)}</span>${tchip(tierFor(p.name, p.tier))}${adm ? `<button type="button" data-tm="remove" data-nick="${esc(p.name)}" title="Убрать">×</button>` : ''}</div>`).join('')}</div>`

function tmBracket(t, adm){
  const total = t.rounds.length;
  const side = (m, k, r) => {
    const name = m[k], sc = m[k === 'a' ? 'sa' : 'sb'];
    if(!name) return `<div class="s tbd">${tmHead(STEVE)}<span class="n">${r === 0 ? 'Пропуск' : 'Ожидается'}</span></div>`;
    const cls = m.w ? (m.w === k ? 'w' : 'l') : '';
    return `<div class="s ${cls}">${tmHead(name)}<span class="n">${esc(name)}</span>${tchip(tierFor(name))}<span class="sc">${sc == null ? '' : sc}</span></div>`;
  };
  const cols = t.rounds.map((round, r) => `<div class="rd${r === total - 1 ? ' final' : ''}">
      <h5>${roundName(r, total)}</h5>
      <div class="rd-b">${round.map((m, i) => {
        const can = adm && m.a && m.b && !m.bye;
        return `<div class="mw"><div class="m${can ? ' can' : ''}"${can ? ` data-match="${r}:${i}"` : ''}>${side(m, 'a', r)}${side(m, 'b', r)}</div></div>`;
      }).join('')}</div>
    </div>`).join('');
  const champ = `<div class="rd champ"><h5>Победитель</h5><div class="rd-b"><div class="mw"><div class="m${t.winner ? '' : ' wait'}">
      ${t.winner ? `<img src="${bust(t.winner)}" data-skin="bust" data-name="${esc(t.winner)}" alt=""><small>Чемпион</small><b>${esc(t.winner)}</b>` : `<small>Чемпион</small><b>Ещё не определён</b>`}
    </div></div></div></div>`;
  return `<div class="br-wrap"><div class="br">${cols}${champ}</div></div>`;
}

function tmDialog(t, r, i){
  const m = t.rounds[r][i];
  tmDlg = {t, r, i, w: m.w || null};
  const ov = document.createElement('div');
  ov.className = 'tm-ov';
  ov.innerHTML = `<div class="tm-dlg" role="dialog">
    <h4>${roundName(r, t.rounds.length)}</h4>
    <p>Выбери, кто выиграл, и запиши счёт.</p>
    <div class="tm-pick">
      <button type="button" data-w="a" class="${m.w === 'a' ? 'on' : ''}"><img src="https://mc-heads.net/avatar/${encodeURIComponent(m.a)}/112" alt=""><span>${esc(m.a)}</span></button>
      <button type="button" data-w="b" class="${m.w === 'b' ? 'on' : ''}"><img src="https://mc-heads.net/avatar/${encodeURIComponent(m.b)}/112" alt=""><span>${esc(m.b)}</span></button>
    </div>
    <div class="tm-sc"><input id="tmSa" type="number" min="0" max="99" inputmode="numeric" value="${m.sa ?? ''}" placeholder="0"><i>:</i><input id="tmSb" type="number" min="0" max="99" inputmode="numeric" value="${m.sb ?? ''}" placeholder="0"></div>
    <div class="tm-msg err" id="tmDlgMsg"></div>
    <div class="acts"><button type="button" class="tbtn ghost" data-x>Отмена</button><button type="button" class="tbtn" data-ok>Сохранить</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); tmDlg = null; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); if(e.key === 'Enter') ov.querySelector('[data-ok]').click(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e => {
    if(e.target === ov || e.target.closest('[data-x]')) return close();
    const pick = e.target.closest('[data-w]');
    if(pick){
      tmDlg.w = pick.dataset.w;
      ov.querySelectorAll('[data-w]').forEach(b => b.classList.toggle('on', b === pick));
      return;
    }
    if(e.target.closest('[data-ok]')){
      const sa = ov.querySelector('#tmSa').value, sb = ov.querySelector('#tmSb').value, out = ov.querySelector('#tmDlgMsg');
      if(!tmDlg.w){ out.textContent = 'Выбери, кто выиграл'; return; }
      if(sa === '' || sb === ''){ out.textContent = 'Впиши счёт'; return; }
      if((tmDlg.w === 'a') !== (+sa > +sb)){ out.textContent = 'У победителя счёт должен быть больше'; return; }
      const winner = m[tmDlg.w];
      document.removeEventListener('keydown', onKey);
      ov.remove();
      tmApi('result', {id: t.id, r, m: i, w: tmDlg.w, sa: +sa, sb: +sb}, `${winner} проходит дальше (${sa}:${sb})`);
    }
  });
  setTimeout(() => ov.querySelector('#tmSa').focus(), 30);
}

function wireTournaments(id){
  if(tms === null) tmLoad();
  if(!tmAdmin()) return;
  const t = id && tms && tms.find(x => x.id === id);
  const create = document.getElementById('tmCreate');
  if(create){
    const go = () => {
      const creator = document.getElementById('tmCreator').value.trim(), name = document.getElementById('tmName').value.trim();
      if(!creator){ tmMsg = {ok: false, text: 'Укажи, кто создаёт турнир'}; router(); return; }
      tmApi('create', {creator, name}).then(r => { if(r && r.list[0]){ tmMsg = null; location.hash = '#/tournaments/' + r.list[0].id; } });
    };
    create.addEventListener('click', go);
    document.querySelectorAll('#tmCreator,#tmName').forEach(i => i.addEventListener('keydown', e => { if(e.key === 'Enter') go(); }));
  }
  if(!t) return;
  const nickIn = document.getElementById('tmNick');
  const add = () => { const nick = nickIn.value.trim(); if(nick) tmApi('player', {id: t.id, nickname: nick}, `${nick} добавлен`).then(() => { const i = document.getElementById('tmNick'); if(i) i.focus(); }); };
  if(nickIn){ nickIn.addEventListener('keydown', e => { if(e.key === 'Enter') add(); }); }
  app.querySelectorAll('[data-tm]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.tm;
    if(a === 'add') add();
    if(a === 'remove') tmApi('player', {id: t.id, nickname: b.dataset.nick, remove: true}, `${b.dataset.nick} убран`);
    if(a === 'start' && confirm(`Начать «${t.name}»? После старта участников менять нельзя.`)) tmApi('start', {id: t.id}, 'Турнир начат, сетка готова');
    if(a === 'delete' && confirm(`Удалить турнир «${t.name}»? Это нельзя отменить.`)) tmApi('delete', {id: t.id}).then(r => { if(r) location.hash = '#/tournaments'; });
  }));
  app.querySelectorAll('[data-match]').forEach(el => el.addEventListener('click', () => {
    const [r, i] = el.dataset.match.split(':').map(Number);
    tmDialog(t, r, i);
  }));
}

function router(){
  const parts = (location.hash || '#/').split('/');
  const seg = parts[1] || '', arg = parts[2] || '';
  const menuFor = {rules:'#/rules', tournaments:'#/tournaments', results:'#/results', me:'#/me', player:'', team:'#/team', admin:'#/admin'};
  KITS.forEach(k => { menuFor[k.route] = '#/' + k.route; });
  const kit = KITS.find(k => k.route === seg);
  const on = seg in menuFor ? menuFor[seg] : '#/';

  let html = '';
  if(seg === 'rules')                html = rulesPage(arg);
  else if(seg === 'tournaments')     html = tournamentsPage(decodeURIComponent(arg));
  else if(!ready)                     html = '<div class="nores">Загрузка тир-листа…</div>';
  else if(loadFailed && seg !== 'me') html = nores('Не удалось загрузить тир-лист. Обнови страницу — если не помогает, возможно, провайдер плохо открывает сайт: попробуй другую сеть или VPN.');
  else if(kit)                        html = tierList(kit);
  else if(seg === 'results')          html = results();
  else if(seg === 'team')             html = teamPage();
  else if(seg === 'admin')            html = adminPage();
  else if(seg === 'me')               html = mePage();
  else if(seg === 'player')           html = playerPage(decodeURIComponent(arg));
  else                                html = leaderboard();

  app.innerHTML = html;
  window.__ready = true;
  renderMenu(on);
  markShortColumns();
  watchSkins();
  wireMePage();
  startProfileFx();
  if(seg === 'team') loadTeam();
  if(seg === 'admin') wireAdmin();
  if(seg === 'tournaments') wireTournaments(decodeURIComponent(arg));
}

// Живой фон профиля: звёзды, частицы-завитки (как эффекты зелий в Minecraft), искры/души и летучие мыши
const FX = {
  pumpkin: {swirl: [['255,196,80', '232,120,24'], ['255,140,40', '200,80,10']], spark: '255,190,90', star: '255,240,215', bats: 3},
  grave:   {swirl: [['140,255,210', '60,200,160'], ['190,140,255', '130,80,220']], spark: '150,255,225', star: '215,255,245', bats: 2},
  winter:  {swirl: [], spark: '240,248,255', star: '230,240,255', bats: 0, snow: true},
  nether:  {swirl: [['255,170,60', '220,80,20']], spark: '255,140,50', star: null, bats: 0},
  end:     {swirl: [['220,140,255', '150,70,220'], ['250,200,255', '190,110,240']], spark: '210,150,255', star: '200,170,255', bats: 0},
  cave:    {swirl: [], spark: '120,240,235', star: null, bats: 2, dust: true},
  jungle:  {swirl: [], spark: '255,240,170', star: null, bats: 0, dust: true},
  icespikes: {swirl: [], spark: '230,245,255', star: '220,240,255', bats: 0, snow: true},
  castle:  {swirl: [], spark: '255,200,120', star: '255,240,215', bats: 2},
  ancient: {swirl: [['80,240,255', '30,150,190']], spark: '90,230,255', star: null, bats: 0},
  sky:     {swirl: [], spark: '255,235,180', star: null, bats: 0, dust: true},
  ocean:   {swirl: [], spark: '180,240,255', star: null, bats: 0, dust: true},
  cherry:  {swirl: [], spark: '255,170,210', star: null, bats: 0, snow: true}
};
let fxRaf = 0;
function startProfileFx(){
  cancelAnimationFrame(fxRaf);
  const cv = document.querySelector('.pfx');
  if(!cv) return;
  const T = FX[cv.dataset.fx] || FX.pumpkin;
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ctx = cv.getContext('2d');
  const P = 3; // размер «пикселя»
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width / P)), h = Math.max(1, Math.round(r.height / P));
  cv.width = w; cv.height = h;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const stars = !T.star ? [] : Array.from({length: Math.round(w * h / 520)}, () => ({x: Math.random() * w | 0, y: Math.random() * h * .35 | 0, ph: rnd(0, 6.28), sp: rnd(.6, 2.2)}));
  const spark = initial => ({x: rnd(0, w), y: initial ? rnd(0, h) : (T.snow ? -2 : h + 2), vy: T.snow ? -rnd(.08, .2) : T.dust ? rnd(.01, .04) : rnd(.04, .14), vx: T.snow ? rnd(-.05, .05) : rnd(-.02, .02), life: initial ? rnd(0, 200) : 0, max: T.snow ? rnd(500, 900) : rnd(260, 560), big: Math.random() < (T.snow ? .45 : .25)});
  const sparks = Array.from({length: Math.round(w / (T.snow ? 7 : T.dust ? 12 : 20))}, () => spark(true));
  const SPR = [
    ['.####..', '#....#.', '#.##.#.', '#.#..#.', '#.####.', '#......', '.#####.'],
    ['.###.', '#...#', '#.#.#', '#..#.', '.##..'],
    ['###', '#.#', '##.']
  ];
  const swirl = initial => ({x: rnd(0, w), y: initial ? h * rnd(.25, 1) : h + 4, vy: rnd(.03, .08), ph: rnd(0, 6.28), life: initial ? rnd(0, 300) : 0, max: rnd(380, 680), s: SPR[Math.random() < .3 ? 0 : Math.random() < .6 ? 1 : 2], flip: Math.random() < .5, c: T.swirl[Math.random() * T.swirl.length | 0]});
  const swirls = !T.swirl.length ? [] : Array.from({length: Math.max(5, Math.round(w / 18))}, () => swirl(true));
  // Летучая мышь: два кадра (крылья вверх / вниз)
  const BAT = [['#.....#', '##.#.##', '.#####.', '...#...'], ['.......', '..###..', '.#####.', '#..#..#']];
  const bat = initial => { const dir = Math.random() < .5 ? 1 : -1; return {x: initial ? rnd(0, w) : (dir > 0 ? -8 : w + 8), y: rnd(h * .08, h * .45), dir, v: rnd(.18, .32), ph: rnd(0, 6.28), fl: rnd(.18, .26)}; };
  const bats = Array.from({length: T.bats}, () => bat(true));
  const sprite = (rows, x0, y0, flip, col) => {
    ctx.fillStyle = col;
    rows.forEach((row, ry) => { for(let rx = 0; rx < row.length; rx++){ if(row[flip ? row.length - 1 - rx : rx] === '#') ctx.fillRect(x0 + rx, y0 + ry, 1, 1); } });
  };
  let last = performance.now();
  function frame(t){
    if(!cv.isConnected) return;
    const dt = Math.min(3, (t - last) / 16.7); last = t;
    ctx.clearRect(0, 0, w, h);
    for(const s of stars){
      const a = .25 + .75 * Math.max(0, Math.sin(t / 1000 * s.sp + s.ph));
      ctx.fillStyle = `rgba(${T.star},${a.toFixed(2)})`;
      ctx.fillRect(s.x, s.y, 1, 1);
    }
    for(let i = 0; i < bats.length; i++){
      const b = bats[i];
      b.x += b.v * b.dir * dt;
      if(b.x < -12 || b.x > w + 12){ bats[i] = bat(false); continue; }
      const y = Math.round(b.y + Math.sin(t / 700 + b.ph) * 3);
      sprite(BAT[Math.floor(t * b.fl / 60) % 2], Math.round(b.x), y, b.dir < 0, 'rgba(8,5,12,.92)');
    }
    for(let i = 0; i < sparks.length; i++){
      const s = sparks[i];
      s.life += dt; s.y -= s.vy * dt; s.x += s.vx * dt + Math.sin((s.life + i * 40) / 60) * .03;
      const k = s.life / s.max;
      if(k >= 1 || s.y < -2 || s.y > h + 3){ sparks[i] = spark(false); continue; }
      const a = k < .15 ? k / .15 : 1 - (k - .15) / .85;
      ctx.fillStyle = `rgba(${T.spark},${(a * .85).toFixed(2)})`;
      ctx.fillRect(s.x | 0, s.y | 0, s.big ? 2 : 1, s.big ? 2 : 1);
    }
    for(let i = 0; i < swirls.length; i++){
      const q = swirls[i];
      q.life += dt; q.y -= q.vy * dt;
      const k = q.life / q.max;
      if(k >= 1 || q.y < -8){ swirls[i] = swirl(false); continue; }
      const a = (k < .2 ? k / .2 : 1 - (k - .2) / .8).toFixed(2);
      const x0 = Math.round(q.x + Math.sin(q.life / 90 + q.ph) * 3), y0 = Math.round(q.y), half = q.s.length / 2;
      q.s.forEach((row, ry) => { ctx.fillStyle = `rgba(${q.c[ry < half ? 0 : 1]},${a})`; for(let rx = 0; rx < row.length; rx++){ if(row[q.flip ? row.length - 1 - rx : rx] === '#') ctx.fillRect(x0 + rx, y0 + ry, 1, 1); } });
    }
    if(!still) fxRaf = requestAnimationFrame(frame);
  }
  frame(last);
  if(!startProfileFx.wired){
    startProfileFx.wired = true;
    let tm; addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(() => { if(document.querySelector('.pfx')) startProfileFx(); }, 150); });
  }
}

function normalize(list){
  return (Array.isArray(list) ? list : [])
    .filter(p => p && p.name && /^R?(HT|LT)[1-5]$/i.test(p.tier || ''))
    .map(p => ({
      name: String(p.name),
      region: p.region || '—',
      tier: String(p.tier).toUpperCase(),
      retired: !!p.retired,
      theme: p.theme || null,
      history: (Array.isArray(p.history) && p.history.length
                  ? p.history.filter(h => h && h.tier)
                  : [{tier: String(p.tier).toUpperCase(), date: null}])
        .map(h => ({tier: String(h.tier).toUpperCase(), date: h.date || null}))
        .sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0))
    }));
}

// склеиваем игроков из всех режимов по нику (без учёта регистра)
function merge(data){
  const byName = {};
  for(const kit of KITS){
    for(const p of normalize(data[kit.key])){
      const key = p.name.toLowerCase();
      const m = byName[key] || (byName[key] = {name: p.name, region: '—', retired: false, kits: {}});
      if(m.region === '—' && p.region !== '—') m.region = p.region;
      m.kits[kit.key] = {tier: p.tier, history: p.history};
      if(p.theme && !m.theme) m.theme = p.theme;
      // Retired — только если во всех режимах у игрока R-тир
      m.retired = Object.values(m.kits).every(k => /^R/.test(k.tier));
    }
  }
  return Object.values(byName);
}

// запасная копия данных на GitHub Pages — её обновляет бот (у части провайдеров основной сервер грузится медленно)
const MIRROR_DATA = 'https://morozbs12.github.io/101/';

async function fetchJson(url, ms, opts){
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl && setTimeout(() => ctrl.abort(), ms);
  try{
    const r = await fetch(url, Object.assign({}, opts, {signal: ctrl ? ctrl.signal : undefined}));
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }finally{
    if(timer) clearTimeout(timer);
  }
}

async function fetchKit(kit){
  if(MIRROR) return fetchJson(kitUrl(kit), 15000);
  try{
    return await fetchJson(kitUrl(kit), 7000, {credentials:'include'});
  }catch(e){
    // основной сервер не ответил — берём копию с GitHub
    console.warn(kit.name + ': основной сервер не ответил, беру зеркало');
    return fetchJson(MIRROR_DATA + kit.file + '?t=' + Date.now(), 12000);
  }
}

async function load(){
  const results = await Promise.all(KITS.map(k => fetchKit(k).catch(e => {
    console.warn('не удалось загрузить ' + k.name + ':', e.message);
    return null;
  })));

  if(results.every(r => r === null)){
    if(!ready){ ready = true; loadFailed = !OFFLINE; router(); }
    return;
  }

  // режим, который не загрузился, оставляем с прошлого раза
  const next = {};
  KITS.forEach((k, i) => { next[k.key] = results[i] !== null ? results[i] : (kitData[k.key] || []); });
  const data = merge(next);
  const changed = JSON.stringify(data) !== JSON.stringify(players);
  kitData = next;
  players = data;
  loadFailed = false;
  // на странице профиля не перерисовываем — там может быть недописанный ник в поле
  if(!ready || (changed && !/^#\/(me|admin|tournaments)/.test(location.hash))){ ready = true; router(); }
}
load();
setInterval(() => { if(!OFFLINE && !document.hidden) load(); }, 30000);

addEventListener('hashchange', () => { router(); scrollTo(0,0); });
paintTextures();
router();
loadMe();
</script>
