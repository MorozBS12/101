<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python: задачі грудня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: bold, young, poster-like — a lesson card students want to open
   IDEA: a printed tear-off calendar sheet: each lesson is one day with a huge date
   PICTURE: the giant date numerals on a full-bleed colour band, one colour per lesson
   COLOUR and TYPE: white / near-black ground, each lesson its own flat accent; Unbounded + Onest + JetBrains Mono
   LAYOUT: band with date and topic, task card, big button, code panel, prev/next */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d0d10);--ink:light-dark(#121214,#f1f1f3);--muted:light-dark(#5a5a66,#a3a3b0);--soft:light-dark(#f2f2f5,#18181d);--line:light-dark(#e2e2e8,#2a2a32);--acc:#ff5a36;--on:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Onest,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 max(5vw,18px)}
h1,h2,.date,.num{font-family:Unbounded,Onest,sans-serif}

/* home */
.hero{background:var(--ink);color:var(--bg);padding:clamp(36px,7vw,72px) 0 clamp(28px,5vw,48px)}
.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.04;margin:10px 0 12px;font-weight:900;text-wrap:balance}
.hero p{margin:0;opacity:.75;max-width:52ch}
.kicker{font-weight:700;font-size:14px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;padding:28px 0 60px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-decoration:none;background:var(--soft);border-radius:20px;padding:18px;border:2px solid transparent;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--c)}
.tile:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.tile .num{background:var(--c);color:var(--o);border-radius:14px;width:76px;height:76px;display:grid;place-items:center;font-weight:900;font-size:21px;letter-spacing:-.02em}
.tile b{display:block;font-size:17px;line-height:1.3}
.tile span{font-size:14px;color:var(--muted)}

/* lesson */
.band{background:var(--acc);color:var(--on);padding:clamp(20px,4vw,36px) 0 clamp(26px,5vw,44px);position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;font-size:15px}
.top a{text-decoration:none;border:2px solid currentColor;border-radius:999px;padding:8px 14px;min-height:44px;display:inline-flex;align-items:center;opacity:.9}
.date{font-size:clamp(84px,24vw,180px);line-height:.86;font-weight:900;letter-spacing:-.05em;margin:22px 0 14px}
.band h1{font-size:clamp(24px,5vw,36px);line-height:1.12;margin:0;font-weight:700;text-wrap:balance;max-width:20ch}
.band .ghost{position:absolute;right:-2vw;bottom:-6vw;font-family:Unbounded;font-weight:900;font-size:clamp(160px,40vw,360px);line-height:1;opacity:.1;pointer-events:none}

.task{padding:28px 0 8px}
.label{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.label i{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.task h2{font-size:clamp(22px,4.4vw,28px);line-height:1.15;margin:8px 0 14px;font-weight:700}
.card{background:var(--soft);border-radius:22px;padding:clamp(18px,4vw,28px);border-left:6px solid var(--acc)}
.card p{margin:0 0 10px}.card p:last-child{margin:0}
.card ol{margin:6px 0 0;padding-left:1.3em}.card li{margin:6px 0}
.card code{font:500 .9em "JetBrains Mono",monospace;background:var(--bg);padding:1px 7px;border-radius:7px;overflow-wrap:anywhere}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;margin:22px 0 0;border:0;border-radius:18px;background:var(--ink);color:var(--bg);font:700 18px Unbounded,sans-serif;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.copy:focus-visible,.nav a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.btn svg{transition:transform .25s}.btn[aria-expanded=true] svg{transform:rotate(180deg)}
.sol{display:none;padding-top:18px}.sol.on{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.sol.on{animation:none}.tile,.btn,.btn svg{transition:none}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px}
.bar b{font-family:Unbounded;font-size:15px;font-weight:700}
.copy{min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:700 15px Onest,sans-serif;cursor:pointer}
pre{overflow-x:auto;margin:0;border-radius:18px;padding:18px 20px;font:14.5px/1.65 "JetBrains Mono",monospace;tab-size:4}
.code{background:#131318;color:#e9e9ef}
.out{background:var(--soft);color:var(--ink);margin-top:0}
.k{color:#ff7ab6}.s{color:#a6e36e}.c{color:#7c7c8f;font-style:italic}.n{color:#ffc857}.f{color:#6cc6ff}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.outbox{margin-top:16px}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:30px 0 60px}
.nav a{display:block;text-decoration:none;background:var(--soft);border-radius:18px;padding:14px 16px;min-height:64px}
.nav a span{display:block;font-size:13px;color:var(--muted)}
.nav a b{font-family:Unbounded;font-size:15px}
.nav .r{text-align:right}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:0 0 40px}
</style>
</head>

"body": "<p>Дано текст:</p>\n<p><code>\"Я вивчаю Excel. Excel допомагає рахувати таблиці. Excel зручний!\"</code></p>\n<ol><li>Виведіть початковий текст.</li>\n<li>Порахуйте, скільки разів трапляється слово «Excel» (<code>.count()</code>).</li>\n<li>Замініть усі «Excel» на «Python» (<code>.replace()</code>) і виведіть новий текст.</li>\n<li>Порахуйте кількість слів (<code>.split()</code>) і довжину тексту (<code>len()</code>).</li>\n<li>Виведіть новий текст великими літерами (<code>.upper()</code>).</li>\n<li>Перевірте через <code>in</code>, що в новому тексті більше немає слова «Excel».</li></ol>",
"code": "text = \"Я вивчаю Excel. Excel допомагає рахувати таблиці. Excel зручний!\"\n\nprint(\"Початковий текст:\")\nprint(text)\n\ncount = text.count(\"Excel\")\nprint(\"Слово Excel трапляється:\", count, \"раз(и)\")\n\nnew_text = text.replace(\"Excel\", \"Python\")\nprint()\nprint(\"Новий текст:\")\nprint(new_text)\n\nwords = new_text.split()\nprint(\"Кількість слів:\", len(words))\nprint(\"Довжина тексту:\", len(new_text), \"символів\")\n\nprint(\"Великими літерами:\")\nprint(new_text.upper())\n\nif \"Excel\" in new_text:\n    print(\"Заміна не вдалася\")\nelse:\n    print(\"Усі слова Excel замінено!\")",

"body": "<p>У школі є три гуртки. Списки учнів записано у множини:</p>\n<p><code>programming = {\"Олег\", \"Марія\", \"Іван\", \"Софія\", \"Андрій\"}</code><br>\n<code>robotics = {\"Марія\", \"Андрій\", \"Тарас\", \"Олена\"}</code><br>\n<code>sport = {\"Іван\", \"Тарас\", \"Марія\", \"Дмитро\"}</code></p>\n<ol><li>Хто ходить і на програмування, і на робототехніку (<code>&amp;</code>)?</li>\n<li>Усі учні трьох гуртків без повторів (<code>|</code>) та їхня кількість.</li>\n<li>Хто ходить <b>лише</b> на програмування (<code>-</code>)?</li>\n<li>Хто ходить лише в один із двох гуртків: програмування або робототехніку (<code>^</code>)?</li>\n<li>Хто ходить <b>в усі три</b> гуртки?</li>\n<li>Додайте Івана в робототехніку (<code>add()</code>) і перевірте через <code>in</code>.</li>\n<li>Дмитро покинув спорт: видаліть його (<code>discard()</code>).</li></ol>\n<p>Щоб імена виводились за алфавітом, використовуйте <code>sorted()</code>.</p>",

"body": "<p>Учні двох класів назвали улюблені фрукти, і багато назв повторилося:</p>\n<p><code>class_a = [\"яблуко\", \"банан\", \"яблуко\", \"груша\", \"банан\", \"ківі\", \"яблуко\"]</code><br>\n<code>class_b = [\"манго\", \"банан\", \"груша\", \"груша\", \"апельсин\", \"ківі\"]</code></p>\n<ol><li>За допомогою <code>set()</code> приберіть повтори в кожному класі.</li>\n<li>Порахуйте, скільки повторів прибрано в класі А.</li>\n<li>Які фрукти люблять <b>в обох</b> класах?</li>\n<li>Складіть список <b>усіх різних</b> фруктів.</li>\n<li>Які фрукти назвали <b>тільки</b> в класі Б?</li>\n<li>Для кожного фрукта порахуйте загальну кількість голосів (<code>.count()</code>).</li></ol>",

"body": "<p>Поле гри «хрестики-нулики» має розмір 3×3. Запишіть його як вкладений список:</p>\n<p><code>[[\"X\",\"O\",\"X\"], [\"O\",\"X\",\"O\"], [\"O\",\"X\",\"X\"]]</code></p>\n<ol><li>Виведіть елемент <b>у центрі</b> поля.</li>\n<li>Виведіть усі <b>чотири кути</b> поля.</li>\n<li>Виведіть перший і останній рядок (індекс <code>-1</code>).</li>\n<li>Зберіть у список <b>середній стовпець</b>.</li>\n<li>Зберіть у список <b>головну діагональ</b> (зліва зверху вправо вниз).</li>\n<li>Якщо всі три клітинки діагоналі однакові, виведіть, хто переміг.</li></ol>\n<p>Підказка: <code>board[рядок][стовпець]</code>, рахунок іде з 0.</p>",

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW=new Set("if else elif for in while def return and or not True False None import from".split(" "));
const FN=new Set("print input len sum set range int str float list".split(" "));
const hl=src=>{
  const re=/(#[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out="",m;
  while(m=re.exec(src)){
    if(m[1])out+=`<span class="c">${esc(m[1])}</span>`;
    else if(m[2])out+=`<span class="s">${esc(m[2])}</span>`;
    else if(m[3])out+=`<span class="n">${m[3]}</span>`;
    else if(m[4])out+=KW.has(m[4])?`<span class="k">${m[4]}</span>`:FN.has(m[4])?`<span class="f">${m[4]}</span>`:m[4];
    else out+=esc(m[5]);
  }
  return out;
};
const arrow=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
const app=document.getElementById("app");

const home=()=>{
  document.documentElement.style.removeProperty("--acc");
  document.title="Python: задачі грудня";
  app.innerHTML=`<header class="hero"><div class="wrap">
    <div class="kicker">Інформатика · Python · грудень</div>
    <h1>Задачі до уроків 08.12 – 23.12</h1>
    <p>Оберіть тему. У кожній задачі є умова і кнопка «Переглянути код».</p>
  </div></header>
  <main class="wrap"><div class="grid">${L.map(x=>`<a class="tile" href="#${x.id}" style="--c:${x.c};--o:${x.o}">
    <div class="num">${x.d}</div><div><b>${x.t}</b><span>Урок ${x.n} · ${x.h}</span></div></a>`).join("")}</div></main>`;
};

const lesson=i=>{
  const x=L[i],p=L[i-1],q=L[i+1];
  const r=document.documentElement.style;r.setProperty("--acc",x.c);r.setProperty("--on",x.o);
  document.title=`${x.d} · ${x.h}`;
  app.innerHTML=`<header class="band"><div class="ghost" aria-hidden="true">${x.n}</div><div class="wrap" style="position:relative">
    <div class="top"><span>Урок ${x.n} · Інформатика</span><a href="#">Усі теми</a></div>
    <div class="date">${x.d}</div>
    <h1>${x.t}</h1>
  </div></header>
  <main class="wrap">
    <section class="task">
      <div class="label"><i></i>Задача</div>
      <h2>${x.h}</h2>
      <div class="card">${x.body}</div>
      <button class="btn" id="show" aria-expanded="false" aria-controls="sol">Переглянути код ${arrow}</button>
      <section class="sol" id="sol">
        <div class="bar"><b>Розв'язок</b><button class="copy" id="copy">Копіювати</button></div>
        <pre class="code">${hl(x.code)}</pre>
        <div class="outbox"><div class="bar"><b>Результат</b></div><pre class="out">${esc(x.out)}</pre>
        ${x.note?`<p class="note">${x.note}</p>`:""}</div>
      </section>
    </section>
    <nav class="nav" aria-label="Інші уроки">
      ${p?`<a href="#${p.id}"><span>← ${p.d}</span><b>${p.h}</b></a>`:"<span></span>"}
      ${q?`<a class="r" href="#${q.id}"><span>${q.d} →</span><b>${q.h}</b></a>`:"<span></span>"}
    </nav>
  </main>`;
  const b=document.getElementById("show"),s=document.getElementById("sol");
  b.addEventListener("click",()=>{const on=s.classList.toggle("on");b.setAttribute("aria-expanded",on);b.innerHTML=(on?"Сховати код ":"Переглянути код ")+arrow;if(on)s.scrollIntoView({behavior:"smooth",block:"start"})});
  const c=document.getElementById("copy");
  c.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(x.code);c.textContent="Скопійовано"}catch(e){c.textContent="Не вдалося"}setTimeout(()=>c.textContent="Копіювати",1600)});
};

const route=()=>{
  const id=location.hash.slice(1),i=L.findIndex(x=>x.id===id);
  i<0?home():lesson(i);
  window.scrollTo(0,0);
};
window.addEventListener("hashchange",route);
route();
}
